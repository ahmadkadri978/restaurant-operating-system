{{- /*
  MySQL credentials secret — generated by Helm, lives only in the cluster.
  Never committed to Git, never stored in GitHub Secrets.

  On first install: Helm generates randAlphaNum passwords and stores them here.
  On upgrade: the Secret already exists in the cluster and is NOT overwritten.
  helm.sh/resource-policy: keep prevents deletion on helm uninstall.

  To rotate the DB password:
    1. kubectl delete secret backend-repo-db-credentials -n <namespace>
    2. Wait for Flux to reconcile — new passwords generated
    3. Connect to MySQL as root and run:
         ALTER USER 'backenduser'@'%' IDENTIFIED BY '<new-password>';
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db-credentials
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: {{ randAlphaNum 32 | quote }}
  MYSQL_DATABASE: "restaurantdb"
  MYSQL_USER: "backenduser"
  MYSQL_PASSWORD: {{ randAlphaNum 32 | quote }}
  DB_URL: {{ printf "jdbc:mysql://%s-mysql:3306/restaurantdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC" .Release.Name | quote }}
  DB_USERNAME: "backenduser"
