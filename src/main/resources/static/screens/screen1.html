<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>قائمة الطعام</title>

    <style>
        :root{
          --bg: #0b0f14;
          --card: rgba(17,24,38,.78);
          --muted: #94a3b8;
          --text: #e5e7eb;
          --border: rgba(255,255,255,.08);
          --shadow: 0 10px 30px rgba(0,0,0,.35);
          --radius: 18px;

          --primary: #22c55e;
          --primary2: rgba(34,197,94,.12);
          --danger: #f87171;
          --chip: rgba(255,255,255,.03);
        }

        *{box-sizing:border-box}
        body{
          margin:0;
          font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Tahoma, Arial, "Noto Sans Arabic", "Noto Sans", sans-serif;
          background: radial-gradient(1200px 700px at 20% -10%, rgba(34,197,94,.18), transparent 55%),
                      radial-gradient(900px 600px at 110% 10%, rgba(59,130,246,.14), transparent 55%),
                      var(--bg);
          color: var(--text);
        }

        .app{
          max-width: 560px;
          margin: 0 auto;
          min-height: 100vh;
          padding-bottom: 140px; /* مساحة للأزرار السفلية */
        }

        /* Top bar */
        .topbar{
          position: sticky;
          top:0;
          z-index: 10;
          background: linear-gradient(180deg, rgba(17,24,38,.98), rgba(17,24,38,.90));
          backdrop-filter: blur(10px);
          border-bottom: 1px solid var(--border);
        }
        .topbar-inner{
          padding: 14px 14px 12px;
          display:flex;
          align-items:center;
          justify-content:space-between;
          gap: 10px;
        }
        .title{
          display:flex;
          align-items:center;
          gap: 10px;
          min-width: 0;
        }
        .logo{
          width: 38px; height: 38px;
          border-radius: 14px;
          background: linear-gradient(135deg, rgba(34,197,94,.35), rgba(34,197,94,.08));
          border: 1px solid rgba(34,197,94,.35);
          display:grid; place-items:center;
          font-weight: 1000;
          color: #bbf7d0;
          flex: 0 0 auto;
        }
        .title-text{min-width:0}
        .title-text .h{
          margin:0;
          font-weight: 1000;
          font-size: 15px;
          white-space: nowrap;
          overflow:hidden;
          text-overflow: ellipsis;
        }
        .title-text .sub{
          margin: 2px 0 0;
          color: var(--muted);
          font-weight: 900;
          font-size: 12.5px;
          white-space: nowrap;
          overflow:hidden;
          text-overflow: ellipsis;
        }
        .pill{
          padding: 8px 10px;
          border-radius: 999px;
          background: rgba(255,255,255,.03);
          border: 1px solid var(--border);
          color: var(--muted);
          font-weight: 950;
          font-size: 12.5px;
          white-space: nowrap;
          flex: 0 0 auto;
        }

         /* items-image */

         .item-row{
          display:flex;
          gap: 12px;
          align-items: flex-start;
        }

        .thumb{
          width: 78px;
          height: 78px;
          border-radius: 16px;
          border: 1px solid rgba(255,255,255,.10);
          background: rgba(255,255,255,.04);
          overflow: hidden;
          flex: 0 0 auto;
        }

        .thumb img{
          width: 100%;
          height: 100%;
          object-fit: cover;
          display:block;
        }

        .thumb .ph{
          width: 100%;
          height: 100%;
          display:grid;
          place-items:center;
          color: rgba(148,163,184,.8);
          font-weight: 1000;
          font-size: 12px;
        }


        /* Search */
        .search-wrap{
          padding: 12px 14px 0;
        }
        .search{
          width: 100%;
          padding: 12px 12px;
          border-radius: 16px;
          border: 1px solid var(--border);
          background: rgba(255,255,255,.03);
          color: var(--text);
          outline: none;
          font-weight: 900;
        }
        .search::placeholder{color: rgba(148,163,184,.85); font-weight: 900;}

        /* Categories chips */
        .chips{
          padding: 10px 14px 6px;
          display:flex;
          gap: 10px;
          overflow-x:auto;
          scrollbar-width:none;
        }
        .chips::-webkit-scrollbar{display:none}
        .chip{
          padding: 8px 10px;
          border-radius: 999px;
          border: 1px solid var(--border);
          background: var(--chip);
          color: var(--muted);
          font-weight: 1000;
          font-size: 12.5px;
          white-space: nowrap;
          cursor: pointer;
          user-select: none;
          flex: 0 0 auto;
        }
        .chip.active{
          background: rgba(59,130,246,.12);
          border-color: rgba(59,130,246,.28);
          color: #dbeafe;
        }

        /* List */
        .content{
          padding: 10px 14px 18px;
        }
        .section-title{
          display:flex;
          align-items:center;
          justify-content:space-between;
          gap: 10px;
          margin: 6px 2px 10px;
        }
        .section-title h2{
          margin:0;
          font-size: 14.5px;
          font-weight: 1000;
        }
        .hint{
          color: var(--muted);
          font-weight: 900;
          font-size: 12.5px;
          white-space: nowrap;
        }

        .card{
          background: linear-gradient(180deg, rgba(17,24,38,.86), rgba(17,24,38,.70));
          border: 1px solid var(--border);
          border-radius: var(--radius);
          padding: 12px;
          margin-bottom: 12px;
          box-shadow: var(--shadow);
        }
        .row{
          display:flex;
          align-items:flex-start;
          justify-content:space-between;
          gap: 10px;
        }
        .meta{
          min-width: 0;
          display:flex;
          flex-direction:column;
          gap: 4px;
        }
        .meta .t{
          font-weight: 1000;
          font-size: 14px;
          white-space: nowrap;
          overflow:hidden;
          text-overflow: ellipsis;
        }
        .meta .s{
          color: var(--muted);
          font-weight: 900;
          font-size: 12.5px;
          line-height: 1.35;
          overflow:hidden;
          text-overflow: ellipsis;
        }
        .price{
          padding: 7px 10px;
          border-radius: 999px;
          border: 1px solid rgba(34,197,94,.28);
          background: rgba(34,197,94,.10);
          color: #bbf7d0;
          font-weight: 1000;
          font-size: 12.5px;
          white-space: nowrap;
          flex: 0 0 auto;
        }

        .actions{
          margin-top: 10px;
          display:flex;
          align-items:center;
          justify-content:space-between;
          gap: 10px;
          border-top: 1px dashed rgba(255,255,255,.10);
          padding-top: 10px;
        }

        .qty{
          display:flex;
          align-items:center;
          gap: 10px;
          background: rgba(255,255,255,.03);
          border: 1px solid rgba(255,255,255,.10);
          border-radius: 14px;
          padding: 8px 10px;
        }
        .qty button{
          width: 34px; height: 34px;
          border-radius: 12px;
          border: 1px solid rgba(255,255,255,.12);
          background: rgba(255,255,255,.04);
          color: var(--text);
          cursor: pointer;
          font-weight: 1000;
          font-size: 16px;
        }
        .qty .num{
          min-width: 28px;
          text-align:center;
          font-weight: 1000;
          font-size: 13px;
          color: var(--text);
        }

        .btn{
          border-radius: 14px;
          padding: 10px 12px;
          font-weight: 1000;
          border: 1px solid rgba(255,255,255,.10);
          background: rgba(255,255,255,.04);
          color: var(--text);
          cursor: pointer;
          user-select: none;
          white-space: nowrap;
        }
        .btn.primary{
          border-color: rgba(187,247,208,.35);
          background: var(--primary2);
          color: #dcfce7;
        }
        .btn.disabled{
          opacity: .55;
          cursor:not-allowed;
          pointer-events: none;
        }

        .empty{
          padding: 18px;
          border: 1px dashed rgba(255,255,255,.14);
          background: rgba(255,255,255,.02);
          border-radius: var(--radius);
          color: var(--muted);
          text-align:center;
          font-weight: 1000;
          margin-top: 12px;
        }

        /* Bottom stack (Service + Cart) */
        .bottom-stack{
          position: fixed;
          bottom: 18px;
          left: 50%;
          transform: translateX(-50%);
          width: calc(100% - 32px);
          max-width: 420px;
          display:flex;
          flex-direction: column;
          gap: 10px;
          z-index: 20;
        }

        .service-btn{
          width: 100%;
          padding: 14px 16px;
          border-radius: 18px;
          border: 1px solid rgba(255,255,255,.18);
          background: linear-gradient(135deg, rgba(34,197,94,.22), rgba(34,197,94,.10));
          color: #dcfce7;
          font-size: 16px;
          font-weight: 1000;
          text-align:center;
          cursor: pointer;
          box-shadow: 0 12px 30px rgba(34,197,94,.25);
        }

        .cart-fab{
          display:flex;
          align-items:center;
          justify-content:space-between;
          gap: 10px;
          width: 100%;
          text-decoration:none;
          padding: 12px 12px;
          border-radius: 18px;
          border: 1px solid rgba(255,255,255,.14);
          background: linear-gradient(180deg, rgba(17,24,38,.90), rgba(17,24,38,.78));
          box-shadow: 0 12px 30px rgba(0,0,0,.35);
          color: var(--text);
        }
        .cart-left{
          display:flex;
          align-items:center;
          gap: 10px;
          min-width:0;
        }
        .cart-icon{
          width: 40px; height: 40px;
          display:grid; place-items:center;
          border-radius: 14px;
          background: rgba(255,255,255,.04);
          border: 1px solid rgba(255,255,255,.10);
          flex: 0 0 auto;
          font-size: 18px;
        }
        .cart-title{
          display:flex;
          flex-direction:column;
          gap: 2px;
          min-width:0;
          font-weight: 1000;
        }
        .cart-title span:first-child{
          font-size: 14px;
          white-space: nowrap;
          overflow:hidden;
          text-overflow: ellipsis;
        }
        .cart-title span:last-child{
          font-size: 12.5px;
          color: var(--muted);
          font-weight: 900;
          white-space: nowrap;
          overflow:hidden;
          text-overflow: ellipsis;
        }
        .cart-badge{
          padding: 8px 10px;
          border-radius: 999px;
          border: 1px solid rgba(59,130,246,.28);
          background: rgba(59,130,246,.10);
          color: #dbeafe;
          font-weight: 1000;
          font-size: 12.5px;
          white-space: nowrap;
          flex: 0 0 auto;
        }

        /* Toast */
        .toast{
          position: fixed;
          left: 50%;
          transform: translateX(-50%);
          bottom: 120px;
          width: min(520px, calc(100% - 24px));
          background: rgba(17,24,38,.92);
          border: 1px solid rgba(255,255,255,.10);
          border-radius: 14px;
          padding: 12px 14px;
          color: var(--text);
          box-shadow: 0 14px 34px rgba(0,0,0,.40);
          display:none;
          font-weight: 1000;
          font-size: 13px;
          z-index: 30;
        }
    </style>
</head>

<body>
<div class="app">

    <header class="topbar">
        <div class="topbar-inner">
            <div class="title">
                <div class="logo">R</div>
                <div class="title-text">
                    <p class="h" id="restaurantName">—</p>
                    <p class="sub" id="tableLine">—</p>
                </div>
            </div>

            <div class="pill" id="statusPill">تحميل...</div>
        </div>

        <div class="search-wrap">
            <input class="search" id="searchInput" type="search" placeholder="ابحث عن صنف..." />
        </div>

        <div class="chips" id="chips"></div>
    </header>

    <main class="content">
        <div class="section-title">
            <h2 id="sectionTitle">الأصناف</h2>
            <div class="hint" id="countHint">—</div>
        </div>

        <section id="list"></section>
        <div class="empty" id="empty" style="display:none;">لا يوجد نتائج.</div>
    </main>

    <!-- Bottom Stack -->
    <div class="bottom-stack">
        <button id="goServiceBtn" class="service-btn" type="button">🛎️ طلب خدمة</button>

        <!-- FLOATING CART BUTTON -->
        <a class="cart-fab" id="cartFab" href="screen2.html" aria-label="فتح السلة">
            <div class="cart-left">
                <div class="cart-icon">🛒</div>
                <div class="cart-title">
                    <span>عرض السلة</span>
                    <span id="cartTotalText">الإجمالي: 0.00</span>
                </div>
            </div>
            <div class="cart-badge" id="cartBadge">0 عنصر</div>
        </a>
    </div>

</div>

<div class="toast" id="toast"></div>

<script>
    // ===== Config =====
    const API_BASE = "https://5cebccdacecb.ngrok-free.app";
    const MENU_ENDPOINT = (qrToken) => `${API_BASE}/api/v1/public/tables/${encodeURIComponent(qrToken)}/menu`;

    // ===== Storage keys =====
    const CART_KEY = "rq_cart_v1";
    const TABLE_LABEL_KEY = "rq_table_label_v1";
    const TABLE_TOKEN_KEY = "rq_table_token_v1";
    const RESTAURANT_NAME_KEY = "rq_restaurant_name_v1";

    // ===== DOM =====
    const restaurantNameEl = document.getElementById('restaurantName');
    const tableLineEl = document.getElementById('tableLine');
    const statusPill = document.getElementById('statusPill');

    const chipsEl = document.getElementById('chips');
    const listEl = document.getElementById('list');
    const emptyEl = document.getElementById('empty');

    const sectionTitleEl = document.getElementById('sectionTitle');
    const countHintEl = document.getElementById('countHint');

    const searchInput = document.getElementById('searchInput');

    const cartFab = document.getElementById('cartFab');
    const cartBadge = document.getElementById('cartBadge');
    const cartTotalText = document.getElementById('cartTotalText');

    const goServiceBtn = document.getElementById('goServiceBtn');

    const toastEl = document.getElementById('toast');
    let toastTimer = null;

    function showToast(message){
      toastEl.textContent = message;
      toastEl.style.display = 'block';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.style.display = 'none', 1700);
    }

    // ===== Helpers =====
    function getQrToken(){
      const url = new URL(window.location.href);
      return url.searchParams.get("token") || url.searchParams.get("qrToken") || url.searchParams.get("t");
    }

    function escapeHtml(str){
      return String(str ?? "").replace(/[&<>"']/g, (m) => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
      }[m]));
    }

    function loadCart(){
      try { return JSON.parse(localStorage.getItem(CART_KEY) || "{}"); } catch { return {}; }
    }
    function saveCart(cart){
      localStorage.setItem(CART_KEY, JSON.stringify(cart));
    }

    function cartCount(cart){
      return Object.values(cart).reduce((sum, it) => sum + (Number(it.qty) || 0), 0);
    }

    function cartTotal(cart){
      return Object.values(cart).reduce((sum, it) => sum + ((Number(it.qty)||0) * (Number(it.price)||0)), 0);
    }

    function updateCartUI(){
      const cart = loadCart();
      const count = cartCount(cart);
      const total = cartTotal(cart);

      cartBadge.textContent = `${count} عنصر`;
      cartTotalText.textContent = `الإجمالي: ${total.toFixed(2)}`;

      // إظهار/إخفاء زر السلة تلقائيًا
      if (count <= 0){
        cartFab.style.display = "none";
      } else {
        cartFab.style.display = "flex";
      }
    }

    // ===== Menu state =====
    let menuData = null; // { restaurantName, tableNumber, categories[], items[] }
    let activeCategoryId = "ALL";

    function categoryNameById(id){
      if (!menuData) return "الكل";
      const c = menuData.categories.find(x => String(x.id) === String(id));
      return c ? c.name : "الكل";
    }

    function buildChips(){
      chipsEl.innerHTML = "";

      const all = document.createElement('div');
      all.className = "chip active";
      all.dataset.cat = "ALL";
      all.textContent = "الكل";
      chipsEl.appendChild(all);

      (menuData.categories || []).forEach(c => {
        const el = document.createElement('div');
        el.className = "chip";
        el.dataset.cat = String(c.id);
        el.textContent = c.name;
        chipsEl.appendChild(el);
      });
    }

    function setActiveChip(cat){
      activeCategoryId = cat;
      document.querySelectorAll('.chip').forEach(ch => ch.classList.toggle('active', ch.dataset.cat === String(cat)));
      sectionTitleEl.textContent = (cat === "ALL") ? "الأصناف" : categoryNameById(cat);
      renderList();
    }

    function filteredItems(){
      if (!menuData) return [];
      const q = (searchInput.value || "").trim().toLowerCase();

      return (menuData.items || [])
        .filter(it => {
          if (activeCategoryId !== "ALL" && String(it.categoryId) !== String(activeCategoryId)) return false;
          if (!q) return true;
          const name = String(it.name || "").toLowerCase();
          const desc = String(it.description || "").toLowerCase();
          return name.includes(q) || desc.includes(q);
        });
    }
    function resolveImageUrl(imageUrl){
      if (!imageUrl) return "";
      const u = String(imageUrl).trim();
      if (!u) return "";

      // absolute URL -> استخدمه كما هو
      if (u.startsWith("http://") || u.startsWith("https://")) return u;

      // relative -> ركّبه مع API_BASE
      return `${API_BASE}${u.startsWith("/") ? "" : "/"}${u}`;
    }


    function renderList(){
      const items = filteredItems();
      listEl.innerHTML = "";
      emptyEl.style.display = items.length ? "none" : "block";
      countHintEl.textContent = `${items.length} صنف`;

      const cart = loadCart();

      items.forEach(it => {
        const id = String(it.id);
        const qty = cart[id]?.qty || 0;

        const card = document.createElement('article');
        card.className = "card";
        card.dataset.itemId = id;

        const imgUrl = resolveImageUrl(it.imageUrl);


        card.innerHTML = `
          <div class="item-row">
            <div class="thumb">
              ${
                imgUrl
                  ? `<img src="${encodeURI(imgUrl)}" alt="${escapeHtml(it.name)}"
                         onerror="this.remove(); this.parentElement.innerHTML='<div class=&quot;ph&quot;>لا توجد صورة</div>';">`
                  : `<div class="ph">لا توجد صورة</div>`
              }
            </div>

            <div style="flex:1; min-width:0;">
              <div class="row">
                <div class="meta">
                  <div class="t">${escapeHtml(it.name)}</div>
                  <div class="s">${escapeHtml(it.description || "")}</div>
                </div>
                <div class="price">${Number(it.price).toFixed(2)}</div>
              </div>

              <div class="actions">
                <div class="qty">
                  <button type="button" class="dec" aria-label="إنقاص">−</button>
                  <div class="num" id="qty_${id}">${qty}</div>
                  <button type="button" class="inc" aria-label="زيادة">+</button>
                </div>

                <button type="button" class="btn primary" data-add="${id}">
                  ${qty > 0 ? "تعديل" : "إضافة"}
                </button>
              </div>
            </div>
          </div>
        `;


        listEl.appendChild(card);
      });
    }

    function ensureCartLineForItem(item){
      const cart = loadCart();
      const id = String(item.id);
      if (!cart[id]){
        cart[id] = {
          id: Number(item.id),
          name: item.name,
          price: Number(item.price),
          qty: 0,
          note: ""
        };
      }
      return cart;
    }

    // ===== Events =====
    chipsEl.addEventListener('click', (e) => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      setActiveChip(chip.dataset.cat);
    });

    searchInput.addEventListener('input', () => {
      renderList();
    });

    // +/- qty
    listEl.addEventListener('click', (e) => {
      const card = e.target.closest('.card');
      if (!card) return;

      const itemId = card.dataset.itemId;
      const item = (menuData.items || []).find(x => String(x.id) === String(itemId));
      if (!item) return;

      const isInc = e.target.closest('.inc');
      const isDec = e.target.closest('.dec');
      if (!isInc && !isDec) return;

      let cart = ensureCartLineForItem(item);
      const line = cart[String(item.id)];
      const current = Number(line.qty || 0);

      let next = current;
      if (isInc) next = current + 1;
      if (isDec) next = Math.max(0, current - 1);

      line.qty = next;

      // إذا صارت 0 احذف السطر بالكامل
      if (line.qty <= 0){
        delete cart[String(item.id)];
      }

      saveCart(cart);

      // تحديث UI للكمية داخل الكارد فقط
      const numEl = document.getElementById(`qty_${item.id}`);
      if (numEl) numEl.textContent = String(next);

      // تحديث زر النص (إضافة/تعديل)
      const addBtn = card.querySelector('[data-add]');
      if (addBtn){
        addBtn.textContent = (next > 0) ? "تعديل" : "إضافة";
      }

      updateCartUI();
    });

    // زر "طلب خدمة" -> screen4 مع تمرير token (اختياري)
    goServiceBtn.addEventListener('click', () => {
      const token = localStorage.getItem(TABLE_TOKEN_KEY) || getQrToken();
      if (token){
        window.location.href = `screen4.html?token=${encodeURIComponent(token)}`;
      } else {
        window.location.href = "screen4.html";
      }
    });

    // ===== Load menu from backend =====
    async function loadMenu(){
      const token = getQrToken();
      if (!token){
        statusPill.textContent = "لا يوجد QR";
        showToast("الرجاء فتح الصفحة عبر QR: ?token=XXXX");
        return;
      }

      localStorage.setItem(TABLE_TOKEN_KEY, token);

      statusPill.textContent = "تحميل...";
      try{
        const res = await fetch(MENU_ENDPOINT(token), {
          method: "GET",
          headers: { "Accept": "application/json" }
        });

        if (!res.ok){
          const txt = await res.text();
          throw new Error(`HTTP ${res.status} - ${txt}`);
        }

        const data = await res.json();
        menuData = data;

        // حفظ سياق الطاولة/المطعم للصفحات الأخرى
        const tableLabel = `طاولة ${data.tableNumber}`;
        localStorage.setItem(TABLE_LABEL_KEY, tableLabel);
        localStorage.setItem(RESTAURANT_NAME_KEY, data.restaurantName);

        restaurantNameEl.textContent = data.restaurantName || "Restaurant";
        tableLineEl.textContent = tableLabel;

        buildChips();
        setActiveChip("ALL");

        statusPill.textContent = "جاهز";
        updateCartUI();
      }catch(err){
        console.error(err);
        statusPill.textContent = "خطأ";
        showToast("تعذر تحميل المنيو. تأكد من qrToken و API_BASE");
      }
    }

    // ===== Init =====
    updateCartUI();
    loadMenu();
</script>
