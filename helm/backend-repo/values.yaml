image:
  repository: fadidasus/order-sys
  tag: "backend-repo-c925fe3"
  pullPolicy: IfNotPresent

replicaCount: 1

# Rolling update: kill old pod before starting new one to avoid double JVM memory on single-node
deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 896Mi

# startupProbe replaces large initialDelaySeconds — allows up to 150s for JVM cold start
startupProbe:
  httpGet:
    path: /actuator/health
    port: 8080
  failureThreshold: 30
  periodSeconds: 5

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 0
  periodSeconds: 10
  failureThreshold: 5
  timeoutSeconds: 3

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 0
  periodSeconds: 20
  failureThreshold: 3
  timeoutSeconds: 5

service:
  port: 8080

ingress:
  host: api.syrianorder.com
  tlsSecret: backend-repo-tls
  clusterIssuer: letsencrypt-prod

redis:
  maxmemory: "64mb"
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi
# DB credentials - injected by CI from DB_PASS GitHub secret.
# DO NOT commit real passwords here. CI overrides these via sed.
db:
  password: "hereyougo1966"
  rootPassword: ""
