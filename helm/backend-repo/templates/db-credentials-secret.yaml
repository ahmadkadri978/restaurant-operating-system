{{- /*
  MySQL credentials secret - generated by Helm, lives only in the cluster.
  Never committed to Git.
  Password priority (most stable wins):
    1. Existing Secret in the cluster (lookup) - preserves passwords across upgrades.
    2. .Values.db.password / .Values.db.rootPassword - injected by CI from the
       DB_PASS GitHub secret (same fixed value every deploy = idempotent).
  On first install on a fresh cluster: CI injects DB_PASS via values, so MySQL
  always initialises with the same password regardless of how many times the
  infrastructure is destroyed and recreated.
  To rotate the DB password:
    1. Update DB_PASS in GitHub Secrets.
    2. kubectl delete secret <release>-db-credentials -n <namespace>
    3. kubectl delete pvc data-<release>-mysql-0 -n <namespace>  (MySQL re-inits)
    4. Flux reconciles - new password from DB_PASS is used.
*/ -}}
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace (printf "%s-db-credentials" .Release.Name)) -}}
{{- $rootPassword := "" -}}
{{- $mysqlPassword := "" -}}
{{- if and $existingSecret $existingSecret.data -}}
  {{- $rootPassword = (index $existingSecret.data "MYSQL_ROOT_PASSWORD" | b64dec) -}}
  {{- $mysqlPassword = (index $existingSecret.data "MYSQL_PASSWORD" | b64dec) -}}
{{- else -}}
  {{- $rootPassword = .Values.db.rootPassword -}}
  {{- $mysqlPassword = .Values.db.password -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db-credentials
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: {{ $rootPassword | quote }}
  MYSQL_DATABASE: "restaurantdb"
  MYSQL_USER: "backenduser"
  MYSQL_PASSWORD: {{ $mysqlPassword | quote }}
  DB_URL: {{ printf "jdbc:mysql://%s-mysql:3306/restaurantdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC" .Release.Name | quote }}
  DB_USERNAME: "backenduser"
