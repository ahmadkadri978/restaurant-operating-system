<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark" />
    <title>Staff Dashboard</title>

    <style>
        :root{
          --bg:#0b0f14;
          --text:#e5e7eb;
          --muted:#94a3b8;
          --border: rgba(255,255,255,.09);
          --card: rgba(17,24,38,.82);
          --shadow: 0 14px 34px rgba(0,0,0,.45);
          --radius: 18px;

          --green: rgba(34,197,94,.20);
          --greenB: rgba(34,197,94,.45);

          --blue: rgba(59,130,246,.16);
          --blueB: rgba(59,130,246,.30);

          --danger: rgba(248,113,113,.16);
          --dangerB: rgba(248,113,113,.30);

          --focus: 0 0 0 3px rgba(34,197,94,.28);
          --tap: rgba(255,255,255,.07);
        }

        *{box-sizing:border-box}
        html,body{height:100%}
        body{
          margin:0;
          font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Tahoma, Arial, "Noto Sans Arabic", sans-serif;
          background:
            radial-gradient(1200px 700px at 20% -10%, rgba(34,197,94,.16), transparent 55%),
            radial-gradient(900px 600px at 110% 10%, rgba(59,130,246,.12), transparent 55%),
            var(--bg);
          color:var(--text);
          -webkit-tap-highlight-color: transparent;
        }
        /* ===== Mobile header fix ===== */
header{
  padding: calc(10px + env(safe-area-inset-top)) 12px 10px;
}

.headRow{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}

.leftHead{
  min-width:0;
  display:flex;
  align-items:center;
  gap:10px;
}

.titles{
  min-width:0;
}
h1{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.headerActions{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;            /* ✅ يسمح باللف */
  justify-content:flex-end;
  max-width: 52%;
}

/* badges don't overflow */
.badge{
  max-width: 140px;
  overflow:hidden;
  text-overflow: ellipsis;
}

/* Small phones */
@media (max-width: 420px){
  .headRow{
    flex-direction: column;   /* ✅ سطرين */
    align-items: stretch;
  }

  .headerActions{
    max-width: 100%;
    justify-content: flex-start;
    flex-wrap: nowrap;        /* ✅ ما يصير تكسير غريب */
    overflow-x: auto;         /* ✅ سحب أفقي */
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .headerActions::-webkit-scrollbar{ display:none; }

  /* keep buttons compact */
  .btn{
    padding: 10px 10px;
    border-radius: 14px;
  }

  /* optional: icon-only buttons */
  .btn .txt{ display:none; }  /* اذا استخدمت span.txt للنص */
  .badge{ max-width: 110px; }
}


        header{
          position: sticky;
          top:0;
          z-index: 10;
          padding:14px;
          display:flex;
          justify-content:space-between;
          align-items:center;
          gap:10px;
          background: linear-gradient(180deg, rgba(17,24,38,.98), rgba(17,24,38,.90));
          backdrop-filter: blur(10px);
          border-bottom:1px solid var(--border)
        }

        .leftHead{display:flex; align-items:center; gap:10px; min-width:0;}
        h1{margin:0;font-size:18px;font-weight:1000; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

        .badge{
          padding:6px 10px;border-radius:999px;
          border:1px solid rgba(255,255,255,.12);
          background:rgba(255,255,255,.05);
          color:#cbd5e1;font-weight:1000;font-size:12.5px;
          white-space:nowrap;
        }
        .badge.ok{ border-color: var(--greenB); background: var(--green); color:#dcfce7; }
        .badge.err{ border-color: var(--dangerB); background: var(--danger); color:#fecaca; }
        .badge.info{ border-color: var(--blueB); background: var(--blue); color:#dbeafe; }

        .headerActions{display:flex; align-items:center; gap:10px; flex:0 0 auto;}
        .btn{
          padding:8px 12px;
          border-radius:12px;
          border:1px solid rgba(255,255,255,.12);
          background:rgba(255,255,255,.06);
          color:var(--text);
          font-weight:1000;
          cursor:pointer;
          user-select:none;
          transition: transform .08s ease, background .18s ease, opacity .18s ease;
        }
        .btn:active{ transform: translateY(1px); background: var(--tap); }
        .btn:focus-visible{ outline:none; box-shadow: var(--focus); }
        .btn.primary{ background:var(--green); border-color:var(--greenB); color:#dcfce7; }
        .btn.ghost{ background:rgba(255,255,255,.03); }
        .btn:disabled{ opacity:.55; cursor:not-allowed; pointer-events:none; }

        .tabs{
          display:flex;
          gap:10px;
          padding:10px;
          justify-content:flex-start;
        }
        .tab{
          padding:8px 14px;
          border-radius:14px;
          cursor:pointer;
          background:rgba(255,255,255,.05);
          border:1px solid rgba(255,255,255,.10);
          font-weight:1000;
        }
        .tab.active{ background:var(--green); border-color: var(--greenB); color:#dcfce7; }
        .tab:active{ background: var(--tap); transform: translateY(1px); }
        .tab:focus-visible{ outline:none; box-shadow: var(--focus); }

        .bar, .toolbar{
  overflow-x:auto;
  flex-wrap: nowrap;
  -webkit-overflow-scrolling: touch;
  scrollbar-width:none;
}
.bar::-webkit-scrollbar, .toolbar::-webkit-scrollbar{ display:none; }

        }
        .chip{
          padding:8px 12px;
          border-radius:999px;
          border:1px solid rgba(255,255,255,.12);
          background:rgba(255,255,255,.05);
          color:#cbd5e1;
          font-weight:1000;
          cursor:pointer;
          user-select:none;
          white-space:nowrap;
          transition: transform .08s ease, background .18s ease;
        }
        .chip:active{ transform: translateY(1px); background: var(--tap); }
        .chip:focus-visible{ outline:none; box-shadow: var(--focus); }
        .chip.active{
          border-color: var(--greenB);
          background: var(--green);
          color:#dcfce7;
        }

        .list{padding:10px;display:flex;flex-direction:column;gap:10px}
        .card{
          padding:12px;border-radius:18px;
          background:var(--card);
          border:1px solid var(--border);
          display:flex;justify-content:space-between;align-items:center;gap:12px;
          box-shadow: 0 10px 24px rgba(0,0,0,.22);
        }
        .meta{min-width:0}
        .meta .t{font-weight:1000; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
        .meta .s{font-size:13px;color:var(--muted);font-weight:900;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

        .right{display:flex;align-items:center;gap:10px;white-space:nowrap}
        .status{
          padding:6px 10px;border-radius:999px;
          border:1px solid rgba(255,255,255,.12);
          background:rgba(255,255,255,.05);
          color:#cbd5e1;font-weight:1000;font-size:12.5px;
        }
        .status.new{ border-color:var(--greenB); background:var(--green); color:#dcfce7; }
        .status.sent{ opacity:.85; }

        .empty{
          padding:20px;
          text-align:center;
          color:var(--muted);
          font-weight:1000;
          display:none;
        }

        .toast{
          position:fixed;left:50%;transform:translateX(-50%);bottom:18px;
          width:min(560px,calc(100% - 24px));
          background:rgba(17,24,38,.92);
          border:1px solid rgba(255,255,255,.12);
          border-radius:14px;padding:12px;display:none;
          font-weight:1000;text-align:center;box-shadow:var(--shadow);
          z-index:50;
        }

        /* Modal */
        .modal-backdrop{
          position:fixed; inset:0;
          background: rgba(0,0,0,.55);
          display:none;
          z-index:60;
          padding: 16px;
        }
        .modal{
          max-width: 560px;
          margin: 0 auto;
          border-radius: 18px;
          background: rgba(17,24,38,.96);
          border: 1px solid rgba(255,255,255,.12);
          box-shadow: var(--shadow);
          overflow:hidden;
        }
        .modal-header{
          padding: 12px 12px;
          display:flex;
          align-items:center;
          justify-content:space-between;
          gap:10px;
          border-bottom: 1px solid rgba(255,255,255,.10);
        }
        .modal-header .title{
          font-weight:1000;
          white-space:nowrap;
          overflow:hidden;
          text-overflow:ellipsis;
          min-width:0;
        }
        .modal-body{
          padding: 12px;
          display:flex;
          flex-direction:column;
          gap:10px;
        }
        .line{
          padding:10px 10px;
          border-radius: 14px;
          border: 1px solid rgba(255,255,255,.10);
          background: rgba(255,255,255,.03);
          display:flex;
          justify-content:space-between;
          gap:10px;
          font-weight: 900;
          color: var(--muted);
        }
        .line b{ color: var(--text); font-weight: 1000; }
        .items{
          margin-top: 6px;
          display:flex;
          flex-direction:column;
          gap:8px;
        }
        .item{
          padding:10px 10px;
          border-radius: 14px;
          border: 1px solid rgba(255,255,255,.10);
          background: rgba(255,255,255,.03);
          display:flex;
          justify-content:space-between;
          gap:10px;
        }
        .item .name{font-weight:1000}
        .item .sub{color:var(--muted);font-weight:900;font-size:12.5px;margin-top:2px}
        .modal-footer{
          padding: 12px;
          border-top: 1px solid rgba(255,255,255,.10);
          display:flex;
          gap:10px;
          flex-wrap: wrap;
        }
        .spin{
          display:inline-block;
          width: 14px; height:14px;
          border-radius:50%;
          border: 2px solid rgba(255,255,255,.22);
          border-top-color: rgba(34,197,94,.8);
          animation: rot .8s linear infinite;
          vertical-align:middle;
        }
        @keyframes rot{to{transform:rotate(360deg)}}

        @media (prefers-reduced-motion: reduce){
          *{ transition:none !important; animation:none !important; }
        }
    </style>
</head>

<body>

<header>
    <div class="leftHead">
        <h1>📋 لوحة الموظف</h1>
        <div id="rest" class="badge">—</div>
        <div id="netStatus" class="badge info">Connecting…</div>
    </div>

    <div class="headerActions">
        <button class="btn" id="toggleAlertsBtn" type="button">
            <span class="ico">🔔</span><span class="txt">تنبيهات</span>
        </button>

        <button class="btn ghost" id="enableSoundBtn" type="button">
            <span class="ico">🔊</span><span class="txt">تفعيل الصوت</span>
        </button>

        <button class="btn" id="logoutBtn" type="button">
            <span class="ico">⎋</span><span class="txt">خروج</span>
        </button>

</header>

<div class="tabs" role="tablist" aria-label="التبويبات">
    <button class="tab active" type="button" data-tab="orders" role="tab" aria-selected="true">الطلبات</button>
    <button class="tab" type="button" data-tab="calls" role="tab" aria-selected="false">النداءات</button>
</div>

<!-- Orders toolbar -->

    <button class="chip" id="chipNewOnly" type="button" aria-pressed="false">NEW فقط</button>
    <button class="chip active" id="chipSortTime" type="button">ترتيب: الوقت</button>

</div>

<!-- Calls toolbar -->

</div>

<div id="calls" class="list" style="display:none"></div>

</audio>

<!-- Modal -->

    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">

            <button class="btn" id="modalRefreshBtn" type="button">تحديث التفاصيل</button>
        </div>
    </div>
</div>

<script>
    // ===== Config =====
    const API = "http://localhost:8081/api/v1/staff";
    const AUTH_KEY = "rq_auth_v1";

    const ORDERS_POLL_MS = 2500;
    const CALLS_POLL_MS  = 2000;
    const CALL_TTL_MS    = 180000;

    // ===== Auth =====
    const auth = JSON.parse(localStorage.getItem(AUTH_KEY) || "null");
    if(!auth || !auth.token) location.href="screen5.html";

    // ===== DOM =====
    const ordersEl = document.getElementById("orders");
    const callsEl  = document.getElementById("calls");
    const emptyEl  = document.getElementById("empty");
    const toastEl  = document.getElementById("toast");
    const sound    = document.getElementById("alertSound");

    const ordersBar = document.getElementById("ordersBar");
    const callsBar  = document.getElementById("callsBar");

    const chipNewOnly   = document.getElementById("chipNewOnly");
    const chipSortTime  = document.getElementById("chipSortTime");
    const chipSortTable = document.getElementById("chipSortTable");

    const modalBackdrop = document.getElementById("modalBackdrop");
    const closeModalBtn = document.getElementById("closeModalBtn");
    const modalTitle    = document.getElementById("modalTitle");
    const modalBody     = document.getElementById("modalBody");
    const modalSendKitchenBtn = document.getElementById("modalSendKitchenBtn");
    const modalRefreshBtn = document.getElementById("modalRefreshBtn");

    const restBadge = document.getElementById("rest");
    const netStatus = document.getElementById("netStatus");
    const enableSoundBtn = document.getElementById("enableSoundBtn");
    const toggleAlertsBtn = document.getElementById("toggleAlertsBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    restBadge.textContent = `Restaurant #${auth.restaurantId}`;

    // ===== UI State =====
    let activeTab = "orders";

    // Orders state
    let orderSince = null;
    const ordersMap = new Map();     // orderId -> summary
    const seenOrderIds = new Set();
    let firstOrdersLoad = true;

    // Calls state
    let callSince = null;
    const callsMap = new Map();
    const seenCallIds = new Set();
    let firstCallsLoad = true;

    // Filters
    let filterNewOnly = false;
    let sortMode = "TIME"; // TIME | TABLE

    // Modal state
    let openOrderId = null;

    // Alerts
    let alertsEnabled = true;
    let soundUnlocked = false;
    let audioCtx = null;
    let audioUnlocked = false;

    // Polling guards
    let pollingOrders = false;
    let pollingCalls = false;

    function showToast(msg){
      toastEl.textContent = msg;
      toastEl.style.display = "block";
      clearTimeout(toastEl._t);
      toastEl._t = setTimeout(()=>toastEl.style.display="none", 1600);
    }

    async function unlockSound(){
      try{
        sound.volume = 0.9;
        // Some browsers need a play() call triggered by user gesture
        await sound.play();
        sound.pause();
        sound.currentTime = 0;
        soundUnlocked = true;
        showToast("✅ تم تفعيل الصوت");
      }catch{
        showToast("⚠️ المتصفح منع الصوت. حاول مرة ثانية");
      }
    }

    enableSoundBtn.addEventListener("click", unlockSound);

    toggleAlertsBtn.addEventListener("click", ()=>{
      alertsEnabled = !alertsEnabled;
      toggleAlertsBtn.setAttribute("aria-pressed", alertsEnabled ? "true" : "false");
      toggleAlertsBtn.textContent = alertsEnabled ? "🔔 تنبيهات: تشغيل" : "🔕 تنبيهات: إيقاف";
    });

    logoutBtn.addEventListener("click", ()=>{
      localStorage.removeItem(AUTH_KEY);
      location.href="screen5.html";
    });
    async function unlockAudio(){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    await audioCtx.resume();
    audioUnlocked = true;
    showToast("✅ تم تفعيل صوت الإشعارات");
  }catch(e){
    console.error(e);
    showToast("⚠️ المتصفح منع الصوت. جرّب مرة ثانية");
  }
}

document.getElementById("enableSoundBtn").addEventListener("click", unlockAudio);

// رنّة واضحة (نمط ringtone) لمدة 2.2 ثانية
function playRingtone(){
  if(!alertsEnabled || !audioUnlocked) return;

  const ctx = audioCtx;
  const now = ctx.currentTime;

  // master gain
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.35, now + 0.02);  // 🔊 أعلى
  gain.connect(ctx.destination);

  // oscillator
  const osc = ctx.createOscillator();
  osc.type = "sine";

  // “رنّة” بتبديل ترددات (قريبة من رنة هاتف)
  const pattern = [
    {f: 880,  d: 0.20},  // A5
    {f: 988,  d: 0.20},  // B5
    {f: 1046, d: 0.20},  // C6
    {f: 988,  d: 0.20},  // B5
    {f: 880,  d: 0.25},  // A5
    {f: 0,    d: 0.25},  // pause
  ];

  let t = now;
  // كرر النمط 3 مرات
  for(let r=0; r<3; r++){
    for(const p of pattern){
      if(p.f === 0){
        // pause (خفض الصوت)
        gain.gain.setValueAtTime(0.0001, t);
        t += p.d;
        continue;
      }
      osc.frequency.setValueAtTime(p.f, t);
      gain.gain.setValueAtTime(0.30, t);
      t += p.d;
    }
  }

  osc.connect(gain);
  osc.start(now);
  osc.stop(t + 0.02);
}

    function playAlert(){
  // اهتزاز قوي + رنّة
  if(navigator.vibrate) navigator.vibrate([200,100,200,100,300]);
  playRingtone();
}

    function callLabel(t){
      if(t==="WAITER") return "استدعاء نادل";
      if(t==="NARA")   return "نارا (شيشا)";
      if(t==="BILL")   return "الحساب";
      return t;
    }

    function orderStatusLabel(s){
      if(s==="NEW") return "NEW";
      if(s==="SENT_TO_KITCHEN") return "SENT_TO_KITCHEN";
      return s;
    }

    function formatTime(iso){
      try{
        const d = new Date(iso);
        return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
      }catch{return "—";}
    }

    function isoMax(a,b){
      if(!a) return b;
      if(!b) return a;
      return (new Date(a).getTime() >= new Date(b).getTime()) ? a : b;
    }

    function remainingSeconds(createdAtIso){
      const createdMs = new Date(createdAtIso).getTime();
      const remainMs = (createdMs + CALL_TTL_MS) - Date.now();
      return Math.max(0, Math.ceil(remainMs / 1000));
    }

    function escapeHtml(str){
      return String(str ?? "").replace(/[&<>"']/g, m => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
      }[m]));
    }

    function setEmpty(isEmpty, msg){
      emptyEl.style.display = isEmpty ? "block" : "none";
      if(isEmpty) emptyEl.textContent = msg || "لا يوجد بيانات";
    }

    function setNetStatus(type, text){
      netStatus.classList.remove("ok","err","info");
      if(type) netStatus.classList.add(type);
      netStatus.textContent = text;
    }

    // ===== Render Orders =====
    function getRenderedOrders(){
      let list = Array.from(ordersMap.values());

      if(filterNewOnly){
        list = list.filter(o => o.status === "NEW");
      }

      if(sortMode === "TABLE"){
        list.sort((a,b)=>{
          const ta = Number(a.tableNumber || 0);
          const tb = Number(b.tableNumber || 0);
          if(ta !== tb) return ta - tb;
          return new Date(b.createdAt) - new Date(a.createdAt);
        });
      } else {
        list.sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));
      }

      return list;
    }

    function renderOrders(){
      ordersEl.innerHTML = "";

      const list = getRenderedOrders();

      if(list.length === 0){
        setEmpty(true, filterNewOnly ? "لا توجد طلبات NEW" : "لا يوجد طلبات حالياً");
        return;
      } else {
        setEmpty(false);
      }

      const frag = document.createDocumentFragment();

      list.forEach(o=>{
        const statusClass = (o.status === "NEW") ? "status new" : "status sent";

        const actionBtn = (o.status === "NEW")
          ? `<button class="btn primary" type="button" data-send-kitchen="${o.orderId}">إرسال للمطبخ</button>`
          : ``;

        const detailsBtn = `<button class="btn" type="button" data-details="${o.orderId}">تفاصيل</button>`;

        const el = document.createElement("div");
        el.className = "card";
        el.innerHTML = `
          <div class="meta">
            <div class="t">طلب #${o.orderId} • طاولة ${o.tableNumber}</div>
            <div class="s">${formatTime(o.createdAt)} • الإجمالي: ${Number(o.totalAmount ?? 0).toFixed(2)}</div>
          </div>
          <div class="right">
            <span class="${statusClass}">${orderStatusLabel(o.status)}</span>
            ${detailsBtn}
            ${actionBtn}
          </div>
        `;
        frag.appendChild(el);
      });

      ordersEl.appendChild(frag);
    }

    // ===== Render Calls =====
    function renderCalls(){
      callsEl.innerHTML = "";

      // delete expired
      for(const [id,c] of callsMap.entries()){
        if(remainingSeconds(c.createdAt) <= 0) callsMap.delete(id);
      }

      const list = Array.from(callsMap.values())
        .sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));

      if(list.length === 0){
        setEmpty(true, "لا توجد نداءات نشطة الآن");
        return;
      } else setEmpty(false);

      const frag = document.createDocumentFragment();

      list.forEach(c=>{
        const sec = remainingSeconds(c.createdAt);
        const m = Math.floor(sec/60);
        const s = sec%60;

        const el = document.createElement("div");
        el.className = "card";
        el.innerHTML = `
          <div class="meta">
            <div class="t">طاولة ${c.tableNumber}</div>
            <div class="s">${callLabel(c.callType)} • ${formatTime(c.createdAt)}</div>
          </div>
          <div class="right">
            <span class="badge info">${m}:${String(s).padStart(2,'0')}</span>
          </div>
        `;
        frag.appendChild(el);
      });

      callsEl.appendChild(frag);
    }

    // ===== Tabs =====
    document.querySelectorAll(".tab").forEach(t=>{
      t.addEventListener("click", ()=>{
        document.querySelectorAll(".tab").forEach(x=>{
          x.classList.remove("active");
          x.setAttribute("aria-selected","false");
        });
        t.classList.add("active");
        t.setAttribute("aria-selected","true");

        activeTab = t.dataset.tab;

        const isOrders = activeTab === "orders";
        ordersEl.style.display = isOrders ? "flex" : "none";
        callsEl.style.display  = isOrders ? "none" : "flex";

        ordersBar.style.display = isOrders ? "flex" : "none";
        callsBar.style.display  = isOrders ? "none" : "flex";

        if(isOrders) renderOrders();
        else renderCalls();
      });
    });

    // ===== Filters =====
    chipNewOnly.addEventListener("click", ()=>{
      filterNewOnly = !filterNewOnly;
      chipNewOnly.classList.toggle("active", filterNewOnly);
      chipNewOnly.setAttribute("aria-pressed", filterNewOnly ? "true" : "false");
      renderOrders();
    });

    chipSortTime.addEventListener("click", ()=>{
      sortMode = "TIME";
      chipSortTime.classList.add("active");
      chipSortTable.classList.remove("active");
      renderOrders();
    });

    chipSortTable.addEventListener("click", ()=>{
      sortMode = "TABLE";
      chipSortTable.classList.add("active");
      chipSortTime.classList.remove("active");
      renderOrders();
    });

    // ===== Poll Orders =====
    async function pollOrders(){
      if(pollingOrders) return;
      pollingOrders = true;

      try{
        const url = new URL(`${API}/orders`);
        url.searchParams.set("page","0");
        url.searchParams.set("size","50");
        if(orderSince) url.searchParams.set("since", orderSince);

        const res = await fetch(url.toString(),{
          headers:{ "Authorization": `Bearer ${auth.token}`, "Accept":"application/json" }
        });

        if(res.status === 401){
          localStorage.removeItem(AUTH_KEY);
          showToast("انتهت الجلسة");
          setTimeout(()=>location.href="screen5.html", 400);
          return;
        }
        if(!res.ok){
          setNetStatus("err","API Error");
          return;
        }

        setNetStatus("ok","Online");

        const data = await res.json();
        const content = data.content || [];

        // Always advance orderSince to max createdAt returned (even if already seen),
        // so we don't get stuck re-fetching same page.
        let maxCreated = orderSince;

        if(content.length){
          let newCount = 0;

          content.forEach(o=>{
            maxCreated = isoMax(maxCreated, o.createdAt);

            // store latest version even if already seen (status/total may change)
            ordersMap.set(o.orderId, o);

            if(!seenOrderIds.has(o.orderId)){
              seenOrderIds.add(o.orderId);
              newCount++;
            }
          });

          orderSince = maxCreated;

          if(!firstOrdersLoad && newCount > 0) playAlert();
          firstOrdersLoad = false;

          if(activeTab === "orders") renderOrders();
        } else {
          firstOrdersLoad = false;
        }
      }catch(e){
        console.error("pollOrders", e);
        setNetStatus("err","Offline?");
      }finally{
        pollingOrders = false;
      }
    }

    // ===== Poll Calls =====
    async function pollCalls(){
      if(pollingCalls) return;
      pollingCalls = true;

      try{
        const url = new URL(`${API}/service-calls`);
        if(callSince) url.searchParams.set("since", callSince);

        const res = await fetch(url.toString(),{
          headers:{ "Authorization": `Bearer ${auth.token}`, "Accept":"application/json" }
        });

        if(res.status === 401){
          localStorage.removeItem(AUTH_KEY);
          showToast("انتهت الجلسة");
          setTimeout(()=>location.href="screen5.html", 400);
          return;
        }
        if(!res.ok) return;

        const data = await res.json(); // array
        let maxCreated = callSince;

        if(data.length){
          let newCount = 0;

          data.forEach(c=>{
            maxCreated = isoMax(maxCreated, c.createdAt);

            callsMap.set(c.id, c);

            if(!seenCallIds.has(c.id)){
              seenCallIds.add(c.id);
              newCount++;
            }
          });

          callSince = maxCreated;

          if(!firstCallsLoad && newCount > 0) playAlert();
          firstCallsLoad = false;

          if(activeTab === "calls") renderCalls();
        } else {
          firstCallsLoad = false;
        }
      }catch(e){
        console.error("pollCalls", e);
      }finally{
        pollingCalls = false;
      }
    }

    // ===== Actions: send-to-kitchen =====
    async function markSentToKitchen(orderId){
      const res = await fetch(`${API}/orders/${orderId}/sent-to-kitchen`,{
        method:"PATCH",
        headers:{ "Authorization": `Bearer ${auth.token}`, "Accept":"application/json" }
      });
      if(!res.ok) throw new Error("patch failed");
      const updated = await res.json().catch(()=>null);

      const o = ordersMap.get(orderId);
      if(o && updated?.status){
        o.status = updated.status;
        ordersMap.set(orderId, o);
      }
    }

    // ===== Modal =====
    function openModal(){
      modalBackdrop.style.display = "block";
      modalBackdrop.setAttribute("aria-hidden","false");
      closeModalBtn.focus();
    }
    function closeModal(){
      modalBackdrop.style.display = "none";
      modalBackdrop.setAttribute("aria-hidden","true");
      openOrderId = null;
    }

    closeModalBtn.addEventListener("click", closeModal);
    modalBackdrop.addEventListener("click", (e)=>{ if(e.target === modalBackdrop) closeModal(); });
    document.addEventListener("keydown", (e)=>{ if(e.key === "Escape" && modalBackdrop.style.display==="block") closeModal(); });

    async function loadOrderDetails(orderId){
      modalBody.innerHTML = `<div class="line"><span>تحميل التفاصيل</span><b><span class="spin"></span></b></div>`;
      modalSendKitchenBtn.style.display = "none";

      try{
        const res = await fetch(`${API}/orders/${orderId}`,{
          headers:{ "Authorization": `Bearer ${auth.token}`, "Accept":"application/json" }
        });

        if(!res.ok){
          modalBody.innerHTML = `<div class="line"><span>خطأ</span><b>تعذر تحميل التفاصيل</b></div>`;
          return;
        }

        const d = await res.json();

        modalTitle.textContent = `تفاصيل الطلب #${d.orderId} • طاولة ${d.tableNumber}`;

        const status = d.status || "—";
        const total = Number(d.totalAmount ?? 0).toFixed(2);
        const note = (d.note || "").trim();

        modalBody.innerHTML = `
          <div class="line"><span>الحالة</span><b>${escapeHtml(status)}</b></div>
          <div class="line"><span>الوقت</span><b>${escapeHtml(formatTime(d.createdAt))}</b></div>
          <div class="line"><span>الإجمالي</span><b>${total}</b></div>
          ${note ? `<div class="line"><span>ملاحظة</span><b>${escapeHtml(note)}</b></div>` : ``}
          <div class="items" id="itemsBox"></div>
        `;

        const itemsBox = document.getElementById("itemsBox");
        const items = d.items || [];

        items.forEach(it=>{
          const el = document.createElement("div");
          el.className = "item";
          el.innerHTML = `
            <div>
              <div class="name">${escapeHtml(it.itemName)} × ${Number(it.quantity || 0)}</div>
              ${it.note ? `<div class="sub">📝 ${escapeHtml(it.note)}</div>` : `<div class="sub">—</div>`}
            </div>
            <div style="text-align:left">
              <div style="font-weight:1000">${Number(it.totalPrice ?? 0).toFixed(2)}</div>
              <div class="sub">سعر: ${Number(it.unitPrice ?? 0).toFixed(2)}</div>
            </div>
          `;
          itemsBox.appendChild(el);
        });

        if(d.status === "NEW"){
          modalSendKitchenBtn.style.display = "inline-flex";
        } else {
          modalSendKitchenBtn.style.display = "none";
        }

      }catch(e){
        console.error(e);
        modalBody.innerHTML = `<div class="line"><span>خطأ</span><b>تعذر الاتصال بالخادم</b></div>`;
      }
    }

    modalRefreshBtn.addEventListener("click", ()=>{ if(openOrderId) loadOrderDetails(openOrderId); });

    modalSendKitchenBtn.addEventListener("click", async ()=>{
      if(!openOrderId) return;

      modalSendKitchenBtn.disabled = true;
      const old = modalSendKitchenBtn.textContent;
      modalSendKitchenBtn.textContent = "جارٍ الإرسال...";

      try{
        await markSentToKitchen(openOrderId);
        showToast("✅ تم إرسال الطلب للمطبخ");
        await loadOrderDetails(openOrderId);
        if(activeTab==="orders") renderOrders();
      }catch{
        showToast("فشل إرسال الطلب للمطبخ");
      }finally{
        modalSendKitchenBtn.disabled = false;
        modalSendKitchenBtn.textContent = old;
      }
    });

    // ===== Global click actions =====
    document.addEventListener("click", async (e)=>{
      const sendBtn = e.target.closest("[data-send-kitchen]");
      if(sendBtn){
        const orderId = Number(sendBtn.dataset.sendKitchen);
        sendBtn.disabled = true;
        const old = sendBtn.textContent;
        sendBtn.textContent = "جارٍ الإرسال...";

        try{
          await markSentToKitchen(orderId);
          showToast("✅ تم إرسال الطلب للمطبخ");
          renderOrders();
        }catch(err){
          console.error(err);
          showToast("فشل تحديث الطلب");
          sendBtn.disabled = false;
          sendBtn.textContent = old;
        }
        return;
      }

      const detailsBtn = e.target.closest("[data-details]");
      if(detailsBtn){
        const orderId = Number(detailsBtn.dataset.details);
        openOrderId = orderId;
        openModal();
        loadOrderDetails(orderId);
        return;
      }
    });

    // ===== Timers =====
    setInterval(pollOrders, ORDERS_POLL_MS);
    setInterval(pollCalls,  CALLS_POLL_MS);

    // Update calls countdown every second (only when calls tab is visible)
    setInterval(()=>{ if(activeTab==="calls") renderCalls(); }, 1000);

    // Initial load
    setNetStatus("info","Connecting…");
    pollOrders();
    pollCalls();
    renderOrders();
</script>

</body>
</html>
