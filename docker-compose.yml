services:
  mysql:
    image: mysql:8.0
    env_file: .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 12

  flyway:
    image: flyway/flyway:10
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - internal
    environment:
      FLYWAY_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true
      FLYWAY_USER: ${MYSQL_USER}
      FLYWAY_PASSWORD: ${MYSQL_PASSWORD}
      FLYWAY_CONNECT_RETRIES: 30
      FLYWAY_BASELINE_ON_MIGRATE: "true"
    volumes:
      - ./migrations:/flyway/sql:ro
    command: migrate

networks:
  internal:
    driver: bridge
  web:
    driver: bridge

volumes:
  mysql_data:
