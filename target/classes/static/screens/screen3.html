<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>تم إرسال الطلب</title>

    <style>
        :root{
          --bg:#0b0f14;
          --text:#e5e7eb;
          --muted:#94a3b8;
          --border: rgba(255,255,255,.08);
          --shadow: 0 12px 36px rgba(0,0,0,.45);
          --radius: 20px;

          --primary:#22c55e;
          --primary2: rgba(34,197,94,.12);
          --blue2: rgba(59,130,246,.12);
          --card: rgba(17,24,38,.78);
        }

        *{box-sizing:border-box}
        body{
          margin:0;
          font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Tahoma, Arial, "Noto Sans Arabic", "Noto Sans", sans-serif;
          background: radial-gradient(1200px 700px at 20% -10%, rgba(34,197,94,.20), transparent 55%),
                      radial-gradient(900px 600px at 110% 10%, rgba(59,130,246,.14), transparent 55%),
                      var(--bg);
          color: var(--text);
        }

        .app{
          max-width: 560px;
          margin: 0 auto;
          min-height: 100vh;
          padding: 18px 14px 22px;
          display:flex;
          flex-direction:column;
          gap: 14px;
        }

        .card{
          background: linear-gradient(180deg, rgba(17,24,38,.88), rgba(17,24,38,.72));
          border: 1px solid var(--border);
          border-radius: var(--radius);
          padding: 14px;
          box-shadow: var(--shadow);
        }

        .hero{
          text-align:center;
          padding: 18px 14px;
        }
        .check{
          width: 86px; height: 86px;
          margin: 4px auto 10px;
          border-radius: 28px;
          background: linear-gradient(135deg, rgba(34,197,94,.35), rgba(34,197,94,.10));
          border: 1px solid rgba(34,197,94,.35);
          display:grid; place-items:center;
          font-size: 38px;
          box-shadow: 0 18px 40px rgba(34,197,94,.18);
        }
        .hero h1{
          margin: 8px 0 6px;
          font-size: 18px;
          font-weight: 1000;
        }
        .hero p{
          margin: 0;
          color: var(--muted);
          font-weight: 900;
          font-size: 13px;
          line-height: 1.6;
        }

        .rows{
          display:flex;
          flex-direction:column;
          gap: 10px;
          margin-top: 10px;
        }
        .row{
          display:flex;
          align-items:center;
          justify-content:space-between;
          gap: 10px;
          padding: 10px 10px;
          border-radius: 16px;
          border: 1px solid rgba(255,255,255,.08);
          background: rgba(255,255,255,.03);
        }
        .row .k{
          color: var(--muted);
          font-weight: 950;
          font-size: 12.5px;
          white-space: nowrap;
        }
        .row .v{
          font-weight: 1000;
          font-size: 13px;
          white-space: nowrap;
          overflow:hidden;
          text-overflow: ellipsis;
          max-width: 70%;
        }

        .btns{
          display:flex;
          flex-direction:column;
          gap: 10px;
        }
        .btn{
          width:100%;
          border-radius: 18px;
          padding: 14px 14px;
          font-weight: 1000;
          border: 1px solid rgba(255,255,255,.10);
          background: rgba(255,255,255,.04);
          color: var(--text);
          cursor: pointer;
          user-select: none;
          text-decoration:none;
          display:flex;
          align-items:center;
          justify-content:center;
          gap: 10px;
          box-shadow: 0 10px 26px rgba(0,0,0,.25);
        }
        .btn.primary{
          border-color: rgba(187,247,208,.35);
          background: var(--primary2);
          color: #dcfce7;
        }
        .btn.blue{
          border-color: rgba(59,130,246,.30);
          background: var(--blue2);
          color: #dbeafe;
        }

        .hint{
          color: var(--muted);
          font-weight: 900;
          font-size: 12.5px;
          line-height: 1.7;
        }

        /* Toast */
        .toast{
          position: fixed;
          left: 50%;
          transform: translateX(-50%);
          bottom: 18px;
          width: min(560px, calc(100% - 24px));
          background: rgba(17,24,38,.92);
          border: 1px solid rgba(255,255,255,.10);
          border-radius: 14px;
          padding: 12px 14px;
          color: var(--text);
          box-shadow: 0 14px 34px rgba(0,0,0,.40);
          display:none;
          font-weight: 1000;
          font-size: 13px;
          z-index: 30;
        }
    </style>
</head>

<body>
<div class="app">

    <section class="card hero">
        <div class="check">✅</div>
        <h1>تم إرسال الطلب بنجاح</h1>
        <p id="subLine">سيتم تجهيز طلبك بأقرب وقت.</p>

        <div class="rows">
            <div class="row">
                <div class="k">المطعم</div>
                <div class="v" id="restaurantName">—</div>
            </div>
            <div class="row">
                <div class="k">الطاولة</div>
                <div class="v" id="tableLabel">—</div>
            </div>
            <div class="row">
                <div class="k">رقم الطلب</div>
                <div class="v" id="orderId">—</div>
            </div>
            <div class="row">
                <div class="k">الوقت</div>
                <div class="v" id="createdAt">—</div>
            </div>
            <div class="row">
                <div class="k">الإجمالي</div>
                <div class="v" id="totalAmount">—</div>
            </div>
        </div>
    </section>

    <section class="card">
        <div class="btns">
            <a class="btn primary" id="goMenuBtn" href="screen1.html">🍽️ العودة للمنيو</a>
            <a class="btn blue" id="goServiceBtn" href="screen4.html">🛎️ طلب خدمة</a>
            <a class="btn" id="goCartBtn" href="screen2.html">🛒 فتح السلة</a>
        </div>

        <div class="hint" style="margin-top:12px;">
            يمكنك طلب خدمة (النادل / نارا / الحساب) في أي وقت من شاشة الخدمات.
        </div>
    </section>

</div>

<div class="toast" id="toast"></div>

<script>
    // ===== Storage keys =====
    const TABLE_LABEL_KEY = "rq_table_label_v1";
    const TABLE_TOKEN_KEY = "rq_table_token_v1";
    const RESTAURANT_NAME_KEY = "rq_restaurant_name_v1";

    const LAST_ORDER_ID_KEY = "rq_last_order_id_v1";
    const LAST_ORDER_CREATED_KEY = "rq_last_order_created_at_v1";
    const LAST_ORDER_TOTAL_KEY = "rq_last_order_total_v1";

    // ===== DOM =====
    const restaurantNameEl = document.getElementById('restaurantName');
    const tableLabelEl = document.getElementById('tableLabel');
    const orderIdEl = document.getElementById('orderId');
    const createdAtEl = document.getElementById('createdAt');
    const totalAmountEl = document.getElementById('totalAmount');

    const goMenuBtn = document.getElementById('goMenuBtn');
    const goServiceBtn = document.getElementById('goServiceBtn');
    const goCartBtn = document.getElementById('goCartBtn');

    const toastEl = document.getElementById('toast');
    let toastTimer = null;

    function showToast(message){
      toastEl.textContent = message;
      toastEl.style.display = 'block';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.style.display = 'none', 1700);
    }

    function safeGet(key, fallback="—"){
      const v = localStorage.getItem(key);
      return (v === null || v === undefined || String(v).trim()==="") ? fallback : v;
    }

    function timePretty(iso){
      if (!iso || iso === "—") return "—";
      try{
        const d = new Date(iso);
        const hh = String(d.getHours()).padStart(2,'0');
        const mm = String(d.getMinutes()).padStart(2,'0');
        const dd = String(d.getDate()).padStart(2,'0');
        const mo = String(d.getMonth()+1).padStart(2,'0');
        return `${hh}:${mm} • ${dd}/${mo}`;
      }catch{
        return iso;
      }
    }

    function withTokenHref(base){
      const token = localStorage.getItem(TABLE_TOKEN_KEY);
      return token ? `${base}?token=${encodeURIComponent(token)}` : base;
    }

    function init(){
      const restaurantName = safeGet(RESTAURANT_NAME_KEY, "Restaurant");
      const tableLabel = safeGet(TABLE_LABEL_KEY, "طاولة —");

      const orderId = safeGet(LAST_ORDER_ID_KEY, "—");
      const createdAt = safeGet(LAST_ORDER_CREATED_KEY, "—");
      const total = safeGet(LAST_ORDER_TOTAL_KEY, "—");

      restaurantNameEl.textContent = restaurantName;
      tableLabelEl.textContent = tableLabel;
      orderIdEl.textContent = orderId;
      createdAtEl.textContent = timePretty(createdAt);

      // total might be numeric string
      const num = Number(total);
      totalAmountEl.textContent = Number.isFinite(num) ? num.toFixed(2) : total;

      // links with token
      goMenuBtn.href = withTokenHref("screen1.html");
      goServiceBtn.href = withTokenHref("screen4.html");
      goCartBtn.href = withTokenHref("screen2.html");

      if (orderId === "—"){
        showToast("ملاحظة: لم يتم العثور على رقم الطلب (فتح مباشر للصفحة)");
      }
    }

    init();
</script>
</body>
</html>
