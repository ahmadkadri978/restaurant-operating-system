---
# MySQL 8.4 StatefulSet â€” dedicated instance for backend-repo.
# Only backend-repo pods can reach this database (NetworkPolicy below).
# Credentials come from {{ .Release.Name }}-db-credentials Secret (Helm-generated, cluster-only).
#
# User creation: MySQL creates MYSQL_USER@% automatically on first init (empty /var/lib/mysql).
# If the password changes after first init, rotate it manually:
#   kubectl exec -n <ns> backend-repo-mysql-0 -- mysql -uroot -p<ROOT_PW> \
#     -e "ALTER USER '<USER>'@'%' IDENTIFIED BY '<NEW_PW>'; FLUSH PRIVILEGES;"
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-mysql
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: {{ .Release.Name }}-mysql
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-mysql
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-mysql
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: mysql
          image: mysql:8.4
          args:
            # Cap InnoDB buffer pool: MySQL 8.4 auto-sizes to ~80% RAM, causing OOMKill on 512Mi.
            # innodb-log-file-size omitted: changing it on existing datadir prevents startup.
            - --innodb-buffer-pool-size=256M
            - --max-connections=100
            - --performance-schema=OFF
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-db-credentials
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-db-credentials
                  key: MYSQL_DATABASE
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-db-credentials
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-db-credentials
                  key: MYSQL_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - 'mysqladmin ping -h 127.0.0.1 -uroot -p"${MYSQL_ROOT_PASSWORD}" --silent'
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - 'mysqladmin ping -h 127.0.0.1 -uroot -p"${MYSQL_ROOT_PASSWORD}" --silent'
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # storageClassName NOT set: volumeClaimTemplates are immutable on existing StatefulSets.
        resources:
          requests:
            storage: 5Gi
---
# Headless Service for backend-repo MySQL
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mysql
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{ .Release.Name }}-mysql
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
  clusterIP: None
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-mysql-deny-all
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}-mysql
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-mysql-allow-from-service
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}-mysql
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 3306
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-mysql-allow-from-backup
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}-mysql
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: {{ .Release.Name }}-mysql-backup
      ports:
        - protocol: TCP
          port: 3306
---
# Backup PVC: uses local-path-retain (WaitForFirstConsumer + Retain).
# Annotated as a post-install/post-upgrade hook so Helm does NOT wait for it to bind
# during install — it binds when the CronJob pod is first scheduled (at 1AM).
# local-path-retain-immediate does NOT work: rancher.io/local-path requires a node
# to be selected before provisioning, which Immediate mode skips → ProvisioningFailed.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-mysql-backup
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: "local-path-retain"
  resources:
    requests:
      storage: 5Gi
---
# CronJob: daily mysqldump at 01:00 UTC, keeps 7 days of compressed backups.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-mysql-backup
  namespace: {{ .Release.Namespace }}
spec:
  schedule: "0 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: {{ .Release.Name }}-mysql-backup
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
          containers:
            - name: mysqldump
              image: mysql:8.4
              command:
                - bash
                - -c
                - |
                  set -euo pipefail
                  DATE=$(date +%Y-%m-%d)
                  BACKUP_FILE="/backup/{{ .Release.Name }}-${DATE}.sql.gz"
                  echo "Starting backup: ${BACKUP_FILE}"
                  mysqldump \
                    -h {{ .Release.Name }}-mysql.{{ .Release.Namespace }}.svc.cluster.local \
                    -uroot -p"${MYSQL_ROOT_PASSWORD}" \
                    --single-transaction --routines --triggers --add-drop-database \
                    --databases "${MYSQL_DATABASE}" \
                  | gzip -9 > "${BACKUP_FILE}"
                  echo "Backup complete: $(du -sh ${BACKUP_FILE})"
                  find /backup -name "{{ .Release.Name }}-*.sql.gz" -mtime +7 -delete
                  echo "Done. Backups:"; ls -lh /backup/
              env:
                - name: MYSQL_ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Release.Name }}-db-credentials
                      key: MYSQL_ROOT_PASSWORD
                - name: MYSQL_DATABASE
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Release.Name }}-db-credentials
                      key: MYSQL_DATABASE
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: {{ .Release.Name }}-mysql-backup
