<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>تسجيل دخول الموظف</title>

    <style>
        :root{
          --bg:#0b0f14;
          --text:#e5e7eb;
          --muted:#94a3b8;
          --border: rgba(255,255,255,.08);
          --shadow: 0 14px 40px rgba(0,0,0,.5);
          --radius: 20px;

          --primary:#22c55e;
          --primary2: rgba(34,197,94,.12);
          --danger:#f87171;
        }

        *{box-sizing:border-box}
        body{
          margin:0;
          font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Tahoma, Arial, "Noto Sans Arabic", sans-serif;
          background: radial-gradient(1200px 700px at 20% -10%, rgba(34,197,94,.18), transparent 55%),
                      var(--bg);
          color: var(--text);
          min-height:100vh;
          display:grid;
          place-items:center;
          padding: 16px;
        }

        .card{
          width:100%;
          max-width:420px;
          background: linear-gradient(180deg, rgba(17,24,38,.9), rgba(17,24,38,.75));
          border: 1px solid var(--border);
          border-radius: var(--radius);
          padding: 18px 16px;
          box-shadow: var(--shadow);
        }

        h1{
          margin: 6px 0 4px;
          font-size: 18px;
          font-weight: 1000;
          text-align:center;
        }
        .sub{
          text-align:center;
          color: var(--muted);
          font-weight: 900;
          font-size: 13px;
          margin-bottom: 14px;
        }

        .field{
          display:flex;
          flex-direction:column;
          gap: 6px;
          margin-bottom: 12px;
        }
        label{
          font-weight: 900;
          font-size: 13px;
          color: var(--muted);
        }
        input{
          padding: 14px;
          border-radius: 16px;
          border: 1px solid var(--border);
          background: rgba(255,255,255,.04);
          color: var(--text);
          outline:none;
          font-weight: 900;
          font-size: 14px;
        }
        input::placeholder{ color: rgba(148,163,184,.7); }

        .btn{
          width:100%;
          padding: 14px;
          border-radius: 18px;
          border: 1px solid rgba(255,255,255,.12);
          background: rgba(255,255,255,.06);
          color: var(--text);
          font-weight: 1000;
          cursor:pointer;
          margin-top: 6px;
        }
        .btn.primary{
          background: var(--primary2);
          border-color: rgba(34,197,94,.35);
          color:#dcfce7;
        }
        .btn.disabled{
          opacity:.6;
          cursor:not-allowed;
          pointer-events:none;
        }

        .error{
          margin-top: 10px;
          padding: 10px 12px;
          border-radius: 14px;
          background: rgba(248,113,113,.12);
          border: 1px solid rgba(248,113,113,.35);
          color:#fecaca;
          font-weight: 900;
          font-size: 13px;
          display:none;
          text-align:center;
        }

        .hint{
          margin-top: 12px;
          text-align:center;
          font-size: 12.5px;
          color: var(--muted);
          font-weight: 900;
          line-height:1.6;
        }
    </style>
</head>

<body>

<div class="card">
    <h1>👨‍🍳 تسجيل دخول الموظف</h1>
    <div class="sub">هذه الشاشة مخصصة لموظفي المطعم فقط</div>

    <div class="field">
        <label>اسم المستخدم</label>
        <input id="username" placeholder="staff01" autocomplete="username" />
    </div>

    <div class="field">
        <label>كلمة المرور</label>
        <input id="password" type="password" placeholder="••••••" autocomplete="current-password" />
    </div>

    <button class="btn primary" id="loginBtn">تسجيل الدخول</button>

    <div class="error" id="errorBox"></div>

    <div class="hint">

    </div>
</div>

<script>
    const API_BASE = "http://localhost:8081";
    const LOGIN_ENDPOINT = `${API_BASE}/api/v1/auth/login`;

    const AUTH_KEY = "rq_auth_v1";

    const usernameEl = document.getElementById('username');
    const passwordEl = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const errorBox = document.getElementById('errorBox');

    function showError(msg){
      errorBox.textContent = msg;
      errorBox.style.display = "block";
    }

    function clearError(){
      errorBox.style.display = "none";
    }

    loginBtn.addEventListener('click', async ()=>{
      clearError();

      const username = usernameEl.value.trim();
      const password = passwordEl.value.trim();

      if(!username || !password){
        showError("الرجاء إدخال اسم المستخدم وكلمة المرور");
        return;
      }

      loginBtn.classList.add('disabled');
      loginBtn.textContent = "جارٍ تسجيل الدخول...";

      try{
        const res = await fetch(LOGIN_ENDPOINT,{
          method:"POST",
          headers:{
            "Content-Type":"application/json",
            "Accept":"application/json"
          },
          body: JSON.stringify({ username, password })
        });

        if(res.status === 401){
          showError("بيانات الدخول غير صحيحة");
          return;
        }

        if(!res.ok){
          showError("حدث خطأ أثناء تسجيل الدخول");
          return;
        }

        const data = await res.json();

        // نحفظ كل ما نحتاجه
        localStorage.setItem(AUTH_KEY, JSON.stringify({
          token: data.token,
          restaurantId: data.restaurantId,
          userId: data.userId,
          role: data.role
        }));

        // تحويل إلى شاشة النداءات
        window.location.href = "screen6.html";

      }catch(e){
        console.error(e);
        showError("تعذر الاتصال بالخادم");
      }finally{
        loginBtn.classList.remove('disabled');
        loginBtn.textContent = "تسجيل الدخول";
      }
    });

    // submit on Enter
    document.addEventListener('keydown', e=>{
      if(e.key === "Enter"){
        loginBtn.click();
      }
    });
</script>

</body>
</html>
