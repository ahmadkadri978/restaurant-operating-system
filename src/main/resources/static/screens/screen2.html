<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>السلة</title>

    <style>
        :root{
          --bg:#0b0f14;
          --text:#e5e7eb;
          --muted:#94a3b8;
          --border: rgba(255,255,255,.08);
          --shadow: 0 10px 30px rgba(0,0,0,.35);
          --radius: 18px;

          --primary:#22c55e;
          --primary2: rgba(34,197,94,.12);
          --danger:#f87171;
          --danger2: rgba(248,113,113,.12);
          --card: rgba(17,24,38,.78);
        }

        *{box-sizing:border-box}
        body{
          margin:0;
          font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Tahoma, Arial, "Noto Sans Arabic", "Noto Sans", sans-serif;
          background: radial-gradient(1200px 700px at 20% -10%, rgba(34,197,94,.18), transparent 55%),
                      radial-gradient(900px 600px at 110% 10%, rgba(59,130,246,.14), transparent 55%),
                      var(--bg);
          color: var(--text);
        }

        .app{
          max-width: 560px;
          margin: 0 auto;
          min-height: 100vh;
          padding-bottom: 120px; /* مساحة لشريط الإرسال */
        }

        /* Topbar */
        .topbar{
          position: sticky;
          top:0;
          z-index: 10;
          background: linear-gradient(180deg, rgba(17,24,38,.98), rgba(17,24,38,.90));
          backdrop-filter: blur(10px);
          border-bottom: 1px solid var(--border);
        }
        .topbar-inner{
          display:flex;
          align-items:center;
          justify-content:space-between;
          gap: 10px;
          padding: 14px 14px;
        }
        .title{
          display:flex;
          align-items:center;
          gap: 10px;
          min-width:0;
        }
        .logo{
          width: 38px; height: 38px;
          border-radius: 14px;
          background: linear-gradient(135deg, rgba(34,197,94,.35), rgba(34,197,94,.08));
          border: 1px solid rgba(34,197,94,.35);
          display:grid; place-items:center;
          font-weight: 1000;
          color:#bbf7d0;
          flex: 0 0 auto;
        }
        .title-text{min-width:0}
        .title-text .h{
          margin:0;
          font-weight: 1000;
          font-size: 15px;
          white-space: nowrap;
          overflow:hidden;
          text-overflow: ellipsis;
        }
        .title-text .sub{
          margin: 2px 0 0;
          color: var(--muted);
          font-weight: 900;
          font-size: 12.5px;
          white-space: nowrap;
          overflow:hidden;
          text-overflow: ellipsis;
        }

        .btn{
          border-radius: 14px;
          padding: 10px 12px;
          font-weight: 1000;
          border: 1px solid rgba(255,255,255,.10);
          background: rgba(255,255,255,.04);
          color: var(--text);
          cursor: pointer;
          user-select: none;
          white-space: nowrap;
          text-decoration:none;
          display:inline-flex;
          align-items:center;
          gap: 8px;
        }
        .btn.primary{
          border-color: rgba(187,247,208,.35);
          background: var(--primary2);
          color: #dcfce7;
        }
        .btn.danger{
          border-color: rgba(248,113,113,.35);
          background: var(--danger2);
          color: #fecaca;
        }
        .btn.disabled{
          opacity:.55;
          cursor:not-allowed;
          pointer-events:none;
        }

        /* Content */
        .content{
          padding: 14px;
        }
        .section{
          background: linear-gradient(180deg, rgba(17,24,38,.86), rgba(17,24,38,.70));
          border: 1px solid var(--border);
          border-radius: var(--radius);
          padding: 12px;
          box-shadow: var(--shadow);
          margin-bottom: 12px;
        }
        .section-title{
          display:flex;
          align-items:center;
          justify-content:space-between;
          gap: 10px;
          margin-bottom: 10px;
        }
        .section-title h2{
          margin:0;
          font-size: 14.5px;
          font-weight: 1000;
        }
        .hint{
          color: var(--muted);
          font-weight: 900;
          font-size: 12.5px;
          white-space: nowrap;
        }

        .item{
          padding: 10px 0;
          border-top: 1px dashed rgba(255,255,255,.10);
          display:flex;
          align-items:flex-start;
          justify-content:space-between;
          gap: 10px;
        }
        .item:first-of-type{ border-top:none; padding-top: 0; }
        .meta{
          min-width:0;
          display:flex;
          flex-direction:column;
          gap: 4px;
        }
        .meta .t{
          font-weight: 1000;
          font-size: 14px;
          white-space: nowrap;
          overflow:hidden;
          text-overflow: ellipsis;
        }
        .meta .s{
          color: var(--muted);
          font-weight: 900;
          font-size: 12.5px;
          line-height:1.35;
        }

        .right{
          display:flex;
          flex-direction:column;
          align-items:flex-end;
          gap: 8px;
          flex: 0 0 auto;
        }

        .price{
          padding: 7px 10px;
          border-radius: 999px;
          border: 1px solid rgba(34,197,94,.28);
          background: rgba(34,197,94,.10);
          color: #bbf7d0;
          font-weight: 1000;
          font-size: 12.5px;
          white-space: nowrap;
        }

        .qty{
          display:flex;
          align-items:center;
          gap: 8px;
          background: rgba(255,255,255,.03);
          border: 1px solid rgba(255,255,255,.10);
          border-radius: 14px;
          padding: 8px 10px;
        }
        .qty button{
          width: 34px; height: 34px;
          border-radius: 12px;
          border: 1px solid rgba(255,255,255,.12);
          background: rgba(255,255,255,.04);
          color: var(--text);
          cursor: pointer;
          font-weight: 1000;
          font-size: 16px;
        }
        .qty .num{
          min-width: 26px;
          text-align:center;
          font-weight: 1000;
          font-size: 13px;
          color: var(--text);
        }

        .remove{
          border-radius: 12px;
          padding: 8px 10px;
          border: 1px solid rgba(248,113,113,.35);
          background: rgba(248,113,113,.10);
          color: #fecaca;
          font-weight: 1000;
          cursor: pointer;
        }

        textarea{
          width: 100%;
          min-height: 92px;
          resize: vertical;
          padding: 12px;
          border-radius: 16px;
          border: 1px solid var(--border);
          background: rgba(255,255,255,.03);
          color: var(--text);
          outline:none;
          font-weight: 900;
          line-height: 1.45;
        }
        textarea::placeholder{ color: rgba(148,163,184,.85); font-weight: 900; }

        .empty{
          padding: 18px;
          border: 1px dashed rgba(255,255,255,.14);
          background: rgba(255,255,255,.02);
          border-radius: var(--radius);
          color: var(--muted);
          text-align:center;
          font-weight: 1000;
        }

        /* Bottom Bar */
        .bottom-bar{
          position: fixed;
          bottom: 18px;
          left: 50%;
          transform: translateX(-50%);
          width: calc(100% - 32px);
          max-width: 560px;
          background: rgba(17,24,38,.92);
          border: 1px solid rgba(255,255,255,.10);
          border-radius: 18px;
          box-shadow: 0 14px 34px rgba(0,0,0,.40);
          padding: 12px;
          z-index: 20;
          display:flex;
          align-items:center;
          justify-content:space-between;
          gap: 12px;
        }
        .bottom-info{
          display:flex;
          flex-direction:column;
          gap: 2px;
          min-width:0;
        }
        .bottom-info .top{
          font-weight: 1000;
          white-space: nowrap;
          overflow:hidden;
          text-overflow: ellipsis;
        }
        .bottom-info .bottom{
          color: var(--muted);
          font-weight: 900;
          font-size: 12.5px;
          white-space: nowrap;
          overflow:hidden;
          text-overflow: ellipsis;
        }

        /* Toast */
        .toast{
          position: fixed;
          left: 50%;
          transform: translateX(-50%);
          bottom: 96px;
          width: min(560px, calc(100% - 24px));
          background: rgba(17,24,38,.92);
          border: 1px solid rgba(255,255,255,.10);
          border-radius: 14px;
          padding: 12px 14px;
          color: var(--text);
          box-shadow: 0 14px 34px rgba(0,0,0,.40);
          display:none;
          font-weight: 1000;
          font-size: 13px;
          z-index: 30;
        }
    </style>
</head>

<body>
<div class="app">

    <header class="topbar">
        <div class="topbar-inner">
            <div class="title">
                <div class="logo">R</div>
                <div class="title-text">
                    <p class="h">السلة</p>
                    <p class="sub" id="contextLine">—</p>
                </div>
            </div>

            <a class="btn" id="backBtn" href="screen1.html">⬅️ الرجوع للمنيو</a>
        </div>
    </header>

    <main class="content">
        <section class="section">
            <div class="section-title">
                <h2>عناصر السلة</h2>
                <div class="hint" id="itemsHint">—</div>
            </div>

            <div id="cartList"></div>
            <div class="empty" id="emptyState" style="display:none;">السلة فارغة.</div>
        </section>

        <section class="section">
            <div class="section-title">
                <h2>ملاحظة الطلب</h2>
                <div class="hint">اختياري</div>
            </div>
            <textarea id="orderNote" maxlength="1000" placeholder="مثال: رجاءً أحضر مناديل..."></textarea>
        </section>

        <section class="section">
            <div class="section-title">
                <h2>معلومات</h2>

            </div>
            <div style="color:var(--muted); font-weight:900; font-size:12.5px; line-height:1.6">
                 يوجد حد طلب واحد لكل طاولة خلال دقيقة.
            </div>
        </section>
    </main>

    <div class="bottom-bar">
        <div class="bottom-info">
            <div class="top" id="bottomTop">الإجمالي: 0.00</div>
            <div class="bottom" id="bottomBottom">جاهز لإرسال الطلب</div>
        </div>

        <button class="btn primary disabled" id="submitBtn" type="button">إرسال الطلب</button>
        <button class="btn danger disabled" id="clearBtn" type="button">تفريغ</button>
    </div>

</div>

<div class="toast" id="toast"></div>

<script>
    // ===== Config =====
    const API_BASE = "https://5cebccdacecb.ngrok-free.app";
    const ORDER_ENDPOINT = (qrToken) => `${API_BASE}/api/v1/public/tables/${encodeURIComponent(qrToken)}/orders`;

    // ===== Storage =====
    const CART_KEY = "rq_cart_v1";
    const TABLE_LABEL_KEY = "rq_table_label_v1";
    const TABLE_TOKEN_KEY = "rq_table_token_v1";
    const RESTAURANT_NAME_KEY = "rq_restaurant_name_v1";

    // ===== DOM =====
    const contextLine = document.getElementById('contextLine');
    const backBtn = document.getElementById('backBtn');

    const cartList = document.getElementById('cartList');
    const emptyState = document.getElementById('emptyState');
    const itemsHint = document.getElementById('itemsHint');

    const orderNoteEl = document.getElementById('orderNote');

    const bottomTop = document.getElementById('bottomTop');
    const bottomBottom = document.getElementById('bottomBottom');

    const submitBtn = document.getElementById('submitBtn');
    const clearBtn = document.getElementById('clearBtn');

    const toastEl = document.getElementById('toast');
    let toastTimer = null;

    function showToast(message){
      toastEl.textContent = message;
      toastEl.style.display = 'block';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.style.display = 'none', 1800);
    }

    // ===== Helpers =====
    function getQrTokenFromUrl(){
      const url = new URL(window.location.href);
      return url.searchParams.get("token") || url.searchParams.get("qrToken") || url.searchParams.get("t");
    }

    function getQrToken(){
      return localStorage.getItem(TABLE_TOKEN_KEY) || getQrTokenFromUrl();
    }

    function escapeHtml(str){
      return String(str ?? "").replace(/[&<>"']/g, (m) => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
      }[m]));
    }

    function loadCart(){
      try { return JSON.parse(localStorage.getItem(CART_KEY) || "{}"); } catch { return {}; }
    }
    function saveCart(cart){
      localStorage.setItem(CART_KEY, JSON.stringify(cart));
    }
    function clearCart(){
      localStorage.removeItem(CART_KEY);
    }

    function cartLines(cart){
      return Object.values(cart)
        .map(x => ({
          id: Number(x.id),
          name: String(x.name ?? ""),
          price: Number(x.price ?? 0), // للعرض فقط
          qty: Number(x.qty ?? 0),
          note: String(x.note ?? "")
        }))
        .filter(x => x.qty > 0)
        .sort((a,b) => a.name.localeCompare(b.name, "ar"));
    }

    function totalAmount(lines){
      return lines.reduce((sum, it) => sum + (it.qty * it.price), 0);
    }
    function totalCount(lines){
      return lines.reduce((sum, it) => sum + it.qty, 0);
    }

    function updateContext(){
      const restaurantName = localStorage.getItem(RESTAURANT_NAME_KEY) || "Restaurant";
      const tableLabel = localStorage.getItem(TABLE_LABEL_KEY) || "طاولة —";
      contextLine.textContent = `${restaurantName} • ${tableLabel}`;

      // رجوع للمنيو مع token إن وجد
      const token = getQrToken();
      backBtn.href = token ? `screen1.html?token=${encodeURIComponent(token)}` : "screen1.html";
    }

    function setBottomState(lines){
      const count = totalCount(lines);
      const total = totalAmount(lines);

      itemsHint.textContent = `${count} عنصر`;
      bottomTop.textContent = `الإجمالي: ${total.toFixed(2)}`;

      const hasItems = count > 0;
      submitBtn.classList.toggle('disabled', !hasItems);
      clearBtn.classList.toggle('disabled', !hasItems);

      if (!hasItems){
        bottomBottom.textContent = "أضف عناصر أولًا من المنيو";
      } else {
        bottomBottom.textContent = "جاهز لإرسال الطلب";
      }
    }

    function render(){
      const cart = loadCart();
      const lines = cartLines(cart);

      cartList.innerHTML = "";
      emptyState.style.display = lines.length ? "none" : "block";

      setBottomState(lines);

      lines.forEach(it => {
        const lineTotal = (it.qty * it.price).toFixed(2);

        const el = document.createElement('div');
        el.className = "item";
        el.dataset.id = String(it.id);

        el.innerHTML = `
          <div class="meta">
            <div class="t">${escapeHtml(it.name)}</div>
            <div class="s">سعر: ${Number(it.price).toFixed(2)} • الإجمالي: ${lineTotal}</div>
          </div>

          <div class="right">
            <div class="price">${lineTotal}</div>

            <div class="qty">
              <button type="button" class="dec" aria-label="إنقاص">−</button>
              <div class="num" id="qty_${it.id}">${it.qty}</div>
              <button type="button" class="inc" aria-label="زيادة">+</button>
            </div>

            <button type="button" class="remove" data-remove="${it.id}">حذف</button>
          </div>
        `;

        cartList.appendChild(el);
      });
    }

    function updateQty(menuItemId, delta){
      const cart = loadCart();
      const key = String(menuItemId);
      if (!cart[key]) return;

      const current = Number(cart[key].qty || 0);
      const next = Math.max(0, current + delta);

      cart[key].qty = next;
      if (next <= 0){
        delete cart[key];
      }
      saveCart(cart);
      render();
    }

    function removeLine(menuItemId){
      const cart = loadCart();
      delete cart[String(menuItemId)];
      saveCart(cart);
      render();
    }

    // ===== Events =====
    cartList.addEventListener('click', (e) => {
      const row = e.target.closest('.item');
      if (!row) return;

      const id = Number(row.dataset.id);

      if (e.target.closest('.inc')) updateQty(id, +1);
      if (e.target.closest('.dec')) updateQty(id, -1);

      const rem = e.target.closest('[data-remove]');
      if (rem) removeLine(Number(rem.dataset.remove));
    });

    clearBtn.addEventListener('click', () => {
      if (clearBtn.classList.contains('disabled')) return;
      clearCart();
      showToast("تم تفريغ السلة");
      render();
    });

    submitBtn.addEventListener('click', async () => {
      if (submitBtn.classList.contains('disabled')) return;

      const token = getQrToken();
      if (!token){
        showToast("لا يوجد QR Token. افتح المنيو عبر QR أولاً");
        return;
      }

      const cart = loadCart();
      const lines = cartLines(cart);
      if (lines.length === 0){
        showToast("السلة فارغة");
        return;
      }

      // تحويل السلة إلى DTO المطلوب من الـ Backend
      const payload = {
        items: lines.map(it => ({
          menuItemId: it.id,
          quantity: it.qty
          // note: غير مطلوب الآن لأنك لا تريد تعديله من هذه الشاشة
        })),
        note: (orderNoteEl.value || "").trim()
      };

      submitBtn.classList.add('disabled');
      clearBtn.classList.add('disabled');
      bottomBottom.textContent = "جارٍ إرسال الطلب...";

      try{
        const res = await fetch(ORDER_ENDPOINT(token), {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify(payload)
        });

        if (res.status === 429){
          // Rate limit
          let msg = "يمكن إرسال طلب واحد فقط لكل طاولة خلال دقيقة.";
          try{
            const err = await res.json();
            if (err && err.message) msg = err.message;
          }catch{}
          showToast(msg);
          bottomBottom.textContent = "انتظر قليلًا ثم حاول مرة أخرى";
          render();
          return;
        }

        if (!res.ok){
          let msg = "حدث خطأ أثناء إرسال الطلب";
          try{
            const err = await res.json();
            if (err && err.message) msg = err.message;
          }catch{}
          showToast(msg);
          bottomBottom.textContent = "تعذر إرسال الطلب";
          render();
          return;
        }

        // Success
        const data = await res.json().catch(() => null);

        // تفريغ السلة حسب خيارك (A)
        clearCart();

        // حفظ آخر orderId (اختياري لاستخدامه في screen3)
        if (data && data.orderId){
          localStorage.setItem("rq_last_order_id_v1", String(data.orderId));
        }
        if (data && data.createdAt){
          localStorage.setItem("rq_last_order_created_at_v1", String(data.createdAt));
        }
        if (data && typeof data.totalAmount !== "undefined"){
          localStorage.setItem("rq_last_order_total_v1", String(data.totalAmount));
        }

        showToast("✅ تم إرسال الطلب بنجاح");

        // انتقال إلى Screen 3
        setTimeout(() => {
          window.location.href = "screen3.html";
        }, 250);

      }catch(err){
        console.error("Submit order error:", err);
        showToast("تعذر الاتصال بالخادم (تحقق من CORS أو API)");
        bottomBottom.textContent = "فشل الاتصال";
        render();
      }
    });

    // ===== Init =====
    updateContext();
    render();
</script>
</body>
</html>
