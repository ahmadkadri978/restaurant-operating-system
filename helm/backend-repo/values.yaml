image:
  repository: fadidasus/order-sys
  tag: "backend-repo-dbe846b"
  pullPolicy: IfNotPresent

replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 768Mi

service:
  port: 8080

ingress:
  host: api.syrianorder.com
  tlsSecret: backend-repo-tls
  clusterIssuer: letsencrypt-prod

redis:
  maxmemory: "64mb"
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

