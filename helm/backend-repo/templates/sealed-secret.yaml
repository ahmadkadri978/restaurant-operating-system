# This file is generated and overwritten by the build-push.yaml pipeline on every push.
# The pipeline seals secrets.APP_JWT_SECRET using the cluster's public cert (secrets.MASTER_CRT).
# Branch determines namespace: main → prod, dev → dev.
# Do NOT edit this file manually.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: backend-repo-secrets
  namespace: prod
spec:
  encryptedData:
    APP_JWT_SECRET: PLACEHOLDER_WILL_BE_REPLACED_BY_PIPELINE_ON_FIRST_PUSH
  template:
    metadata:
      creationTimestamp: null
      name: backend-repo-secrets
      namespace: prod
