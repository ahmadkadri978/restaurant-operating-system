{{- /*
  MySQL credentials secret - generated by Helm, lives only in the cluster.
  On first install: Helm generates random passwords and stores them here.
  On upgrade: existing passwords are PRESERVED via Helm lookup function.
  helm.sh/resource-policy: keep prevents deletion on helm uninstall.
  To rotate the DB password:
    1. kubectl delete secret <release>-db-credentials -n <namespace>
    2. kubectl delete pvc data-<release>-mysql-0 -n <namespace>
    3. Wait for Flux to reconcile - new passwords generated, MySQL reinitializes
*/ -}}
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace (printf "%s-db-credentials" .Release.Name)) -}}
{{- $rootPassword := "" -}}
{{- $mysqlPassword := "" -}}
{{- if and $existingSecret $existingSecret.data -}}
  {{- $rootPassword = (index $existingSecret.data "MYSQL_ROOT_PASSWORD" | b64dec) -}}
  {{- $mysqlPassword = (index $existingSecret.data "MYSQL_PASSWORD" | b64dec) -}}
{{- else -}}
  {{- $rootPassword = (randAlphaNum 32) -}}
  {{- $mysqlPassword = (randAlphaNum 32) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db-credentials
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: {{ $rootPassword | quote }}
  MYSQL_DATABASE: "restaurantdb"
  MYSQL_USER: "backenduser"
  MYSQL_PASSWORD: {{ $mysqlPassword | quote }}
  DB_URL: {{ printf "jdbc:mysql://%s-mysql:3306/restaurantdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC" .Release.Name | quote }}
  DB_USERNAME: "backenduser"