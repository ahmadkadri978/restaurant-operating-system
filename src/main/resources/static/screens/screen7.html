<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark" />
    <title>Screen7 - لوحة المطبخ</title>
    <link rel="icon" href="data:,">

    <style>
        :root{
          --bg:#0b0f14;
          --text:#e5e7eb;
          --muted:#94a3b8;
          --border: rgba(255,255,255,.09);
          --card: rgba(17,24,38,.86);
          --shadow: 0 14px 34px rgba(0,0,0,.45);

          --green: rgba(34,197,94,.20);
          --greenB: rgba(34,197,94,.45);

          --blue: rgba(59,130,246,.16);
          --blueB: rgba(59,130,246,.30);

          --danger: rgba(248,113,113,.16);
          --dangerB: rgba(248,113,113,.30);

          --amber: rgba(251,191,36,.16);
          --amberB: rgba(251,191,36,.30);

          --focus: 0 0 0 3px rgba(59,130,246,.28);
          --tap: rgba(255,255,255,.07);

          --r: 18px;
        }

        *{box-sizing:border-box}
        html,body{height:100%}
        body{
          margin:0;
          font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Tahoma, Arial, "Noto Sans Arabic", sans-serif;
          background:
            radial-gradient(1200px 700px at 20% -10%, rgba(59,130,246,.16), transparent 55%),
            radial-gradient(900px 600px at 110% 10%, rgba(34,197,94,.10), transparent 55%),
            var(--bg);
          color:var(--text);
          -webkit-tap-highlight-color: transparent;
        }

        header{
          padding: calc(10px + env(safe-area-inset-top)) 12px 10px;
          position: sticky;
          top:0;
          z-index: 10;
          background: linear-gradient(180deg, rgba(17,24,38,.98), rgba(17,24,38,.90));
          backdrop-filter: blur(10px);
          border-bottom:1px solid var(--border)
        }

        .headRow{
          display:flex;
          align-items:flex-start;
          justify-content:space-between;
          gap:10px;
          width:100%;
        }

        .leftHead{
          min-width:0;
          display:flex;
          flex-direction:column;
          gap:8px;
          flex:1;
        }

        .topLine{
          display:flex;
          align-items:center;
          gap:10px;
          min-width:0;
        }

        h1{
          margin:0;
          font-size:18px;
          font-weight:1000;
          white-space:nowrap;
          overflow:hidden;
          text-overflow:ellipsis;
        }

        .subLine{
          display:flex;
          gap:8px;
          flex-wrap:wrap;
          align-items:center;
        }

        .badge{
          padding:6px 10px;border-radius:999px;
          border:1px solid rgba(255,255,255,.12);
          background:rgba(255,255,255,.05);
          color:#cbd5e1;font-weight:1000;font-size:12.5px;
          white-space:nowrap;
          max-width: 170px;
          overflow:hidden;
          text-overflow: ellipsis;
        }
        .badge.ok{ border-color: var(--greenB); background: var(--green); color:#dcfce7; }
        .badge.err{ border-color: var(--dangerB); background: var(--danger); color:#fecaca; }
        .badge.info{ border-color: var(--blueB); background: var(--blue); color:#dbeafe; }
        .badge.count{ border-color: var(--blueB); background: rgba(59,130,246,.10); color:#dbeafe; }

        .headerActions{
          display:flex;
          gap:8px;
          align-items:center;
          flex-wrap:wrap;
          justify-content:flex-end;
          flex:0 0 auto;
          max-width: 52%;
        }

        .btn{
          padding:8px 12px;
          border-radius:12px;
          border:1px solid rgba(255,255,255,.12);
          background:rgba(255,255,255,.06);
          color:var(--text);
          font-weight:1000;
          cursor:pointer;
          user-select:none;
          transition: transform .08s ease, background .18s ease, opacity .18s ease;
          white-space:nowrap;
          display:inline-flex;
          align-items:center;
          gap:8px;
        }
        .btn:active{ transform: translateY(1px); background: var(--tap); }
        .btn:focus-visible{ outline:none; box-shadow: var(--focus); }
        .btn.primary{ background:var(--blue); border-color:var(--blueB); color:#dbeafe; }
        .btn.danger{ background:var(--danger); border-color:var(--dangerB); color:#fecaca; }
        .btn.ghost{ background:rgba(255,255,255,.03); }
        .btn:disabled{ opacity:.55; cursor:not-allowed; pointer-events:none; }
        .btn.big{ padding:10px 14px; border-radius:14px; font-size:14px; }

        @media (max-width: 420px){
          .headRow{ flex-direction: column; align-items: stretch; }
          .headerActions{
            max-width: 100%;
            justify-content: flex-start;
            flex-wrap: nowrap;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
          }
          .headerActions::-webkit-scrollbar{ display:none; }
          .btn{ padding: 10px 10px; border-radius: 14px; }
          .btn .txt{ display:none; }
          .badge{ max-width: 120px; }
        }

        /* Toolbar */
        .bar{
          overflow-x:auto;
          flex-wrap: nowrap;
          -webkit-overflow-scrolling: touch;
          scrollbar-width:none;
          display:flex;
          gap:10px;
          padding:10px;
          align-items:center;
        }
        .bar::-webkit-scrollbar{ display:none; }

        .chip{
          padding:8px 12px;
          border-radius:999px;
          border:1px solid rgba(255,255,255,.12);
          background:rgba(255,255,255,.05);
          color:#cbd5e1;
          font-weight:1000;
          cursor:pointer;
          user-select:none;
          white-space:nowrap;
          transition: transform .08s ease, background .18s ease;
        }
        .chip:active{ transform: translateY(1px); background: var(--tap); }
        .chip.active{
          border-color: var(--blueB);
          background: var(--blue);
          color:#dbeafe;
        }

        /* List */
        .list{padding:10px;display:flex;flex-direction:column;gap:10px}

        .card{
          padding:12px;
          border-radius: var(--r);
          background:var(--card);
          border:1px solid var(--border);
          box-shadow: 0 10px 24px rgba(0,0,0,.22);
          display:flex;
          flex-direction:column;
          gap:10px;
        }

        .cardTop{
          display:flex;
          justify-content:space-between;
          gap:10px;
          align-items:center;
        }

        .tablePill{
          display:inline-flex;
          align-items:center;
          gap:8px;
          padding:8px 12px;
          border-radius:999px;
          border:1px solid rgba(255,255,255,.12);
          background:rgba(255,255,255,.05);
          font-weight:1000;
        }
        .tablePill b{ font-size:15px; }

        .timePill{
          padding:6px 10px;
          border-radius:999px;
          border:1px solid rgba(255,255,255,.12);
          background:rgba(255,255,255,.04);
          color:#cbd5e1;
          font-weight:1000;
          font-size:12.5px;
          white-space:nowrap;
        }

        .late{
          border-color: var(--amberB)!important;
          background: var(--amber)!important;
          color:#fde68a!important;
        }

        .cardBottom{
          display:flex;
          justify-content:space-between;
          gap:10px;
          align-items:center;
          flex-wrap:wrap;
        }

        .status{
          padding:6px 10px;border-radius:999px;
          border:1px solid var(--blueB);
          background:var(--blue);
          color:#dbeafe;
          font-weight:1000;font-size:12.5px;
        }

        .total{
          font-weight:1000;
          color:#dbeafe;
          white-space:nowrap;
        }

        .actions{
          display:flex;
          gap:10px;
          flex-wrap:wrap;
          margin-right:auto;
        }

        .empty{
          padding:20px;
          text-align:center;
          color:var(--muted);
          font-weight:1000;
          display:none;
        }

        .toast{
          position:fixed;left:50%;transform:translateX(-50%);bottom:18px;
          width:min(560px,calc(100% - 24px));
          background:rgba(17,24,38,.92);
          border:1px solid rgba(255,255,255,.12);
          border-radius:14px;padding:12px;display:none;
          font-weight:1000;text-align:center;box-shadow:var(--shadow);
          z-index:50;
        }

        /* Modal */
        .modal-backdrop{
          position:fixed; inset:0;
          background: rgba(0,0,0,.55);
          display:none;
          z-index:60;
          padding: 16px;
        }
        .modal{
          max-width: 560px;
          margin: 0 auto;
          border-radius: 18px;
          background: rgba(17,24,38,.96);
          border: 1px solid rgba(255,255,255,.12);
          box-shadow: var(--shadow);
          overflow:hidden;
        }
        .modal-header{
          padding: 12px 12px;
          display:flex;
          align-items:center;
          justify-content:space-between;
          gap:10px;
          border-bottom: 1px solid rgba(255,255,255,.10);
        }
        .modal-header .title{
          font-weight:1000;
          white-space:nowrap;
          overflow:hidden;
          text-overflow:ellipsis;
          min-width:0;
        }
        .modal-body{
          padding: 12px;
          display:flex;
          flex-direction:column;
          gap:10px;
        }
        .line{
          padding:10px 10px;
          border-radius: 14px;
          border: 1px solid rgba(255,255,255,.10);
          background: rgba(255,255,255,.03);
          display:flex;
          justify-content:space-between;
          gap:10px;
          font-weight: 900;
          color: var(--muted);
        }
        .line b{ color: var(--text); font-weight: 1000; }
        .items{
          margin-top: 6px;
          display:flex;
          flex-direction:column;
          gap:8px;
        }
        .item{
          padding:10px 10px;
          border-radius: 14px;
          border: 1px solid rgba(255,255,255,.10);
          background: rgba(255,255,255,.03);
          display:flex;
          justify-content:space-between;
          gap:10px;
        }
        .item .name{font-weight:1000}
        .item .sub{color:var(--muted);font-weight:900;font-size:12.5px;margin-top:2px}
        .modal-footer{
          padding: 12px;
          border-top: 1px solid rgba(255,255,255,.10);
          display:flex;
          gap:10px;
          flex-wrap: wrap;
        }
        .spin{
          display:inline-block;
          width: 14px; height:14px;
          border-radius:50%;
          border: 2px solid rgba(255,255,255,.22);
          border-top-color: rgba(59,130,246,.8);
          animation: rot .8s linear infinite;
          vertical-align:middle;
        }
        @keyframes rot{to{transform:rotate(360deg)}}

        .confirm-actions{
          display:flex;
          gap:10px;
          flex-wrap:wrap;
          margin-top:6px;
        }
    </style>
</head>

<body>

<header>
    <div class="headRow">
        <div class="leftHead">
            <div class="topLine">
                <h1>🍳 لوحة المطبخ</h1>
            </div>
            <div class="subLine">
                <div id="rest" class="badge">—</div>
                <div id="netStatus" class="badge info">Connecting…</div>
                <div id="kitchenCount" class="badge count"> قيد التحضير: 0</div>
            </div>
        </div>

        <div class="headerActions">
            <button class="btn" id="toggleAlertsBtn" type="button">
                <span class="ico">🔔</span><span class="txt">تنبيهات</span>
            </button>

            <button class="btn ghost" id="enableSoundBtn" type="button">
                <span class="ico">🔊</span><span class="txt">تفعيل الصوت</span>
            </button>

            <button class="btn ghost" id="goStaffBtn" type="button">
                <span class="ico">📋</span><span class="txt">لوحة الموظفين</span>
            </button>

            <button class="btn" id="logoutBtn" type="button">
                <span class="ico">⎋</span><span class="txt">خروج</span>
            </button>
        </div>
    </div>
</header>

<div class="bar" id="ordersBar">
    <button class="chip active" id="chipSortTime" type="button">ترتيب: الوقت</button>
    <button class="chip" id="chipSortTable" type="button">ترتيب: الطاولة</button>
</div>

<div id="orders" class="list"></div>
<div id="empty" class="empty">لا يوجد بيانات</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Modal: تفاصيل الطلب -->
<div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-header">
            <div class="title" id="modalTitle">تفاصيل الطلب</div>
            <button class="btn ghost" id="closeModalBtn" type="button">إغلاق ✕</button>
        </div>

        <div class="modal-body" id="modalBody"></div>

        <div class="modal-footer">
            <button class="btn danger" id="modalDoneBtn" style="display:none" type="button">تم الإنجاز ✅</button>
            <button class="btn" id="modalRefreshBtn" type="button">تحديث التفاصيل</button>
        </div>
    </div>
</div>

<!-- Modal: تأكيد "تم الإنجاز" -->
<div class="modal-backdrop" id="confirmBackdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
        <div class="modal-header">
            <div class="title" id="confirmTitle">تأكيد</div>
            <button class="btn ghost" id="closeConfirmBtn" type="button">إغلاق ✕</button>
        </div>
        <div class="modal-body">
            <div class="line">
                <span>هل أنت متأكد أن الطلب تم إنجازه بالكامل؟</span>
                <b>⚠️</b>
            </div>
            <div class="line">
                <span>بعد التأكيد سيختفي الطلب من لوحة المطبخ.</span>
                <b>—</b>
            </div>

            <div class="confirm-actions">
                <button class="btn danger" id="confirmYesBtn" type="button">نعم، متأكد ✅</button>
                <button class="btn ghost" id="confirmNoBtn" type="button">إلغاء</button>
            </div>
        </div>
    </div>
</div>

<script>
    // ===== Config =====
    const API = "https://5cebccdacecb.ngrok-free.app/api/v1/staff";
    const AUTH_KEY = "rq_auth_v1";

    // endpoint لتسجيل "تم الإنجاز"
    const DONE_ENDPOINT_SUFFIX = "/done";

    const ORDERS_POLL_MS = 2500;

    // ===== Auth =====
    const auth = JSON.parse(localStorage.getItem(AUTH_KEY) || "null");
    if(!auth || !auth.token) location.href="screen5.html";

    // ===== DOM =====
    const ordersEl = document.getElementById("orders");
    const emptyEl  = document.getElementById("empty");
    const toastEl  = document.getElementById("toast");
    const kitchenCount = document.getElementById("kitchenCount");

    const chipSortTime  = document.getElementById("chipSortTime");
    const chipSortTable = document.getElementById("chipSortTable");

    const modalBackdrop = document.getElementById("modalBackdrop");
    const closeModalBtn = document.getElementById("closeModalBtn");
    const modalTitle    = document.getElementById("modalTitle");
    const modalBody     = document.getElementById("modalBody");
    const modalDoneBtn  = document.getElementById("modalDoneBtn");
    const modalRefreshBtn = document.getElementById("modalRefreshBtn");

    const confirmBackdrop = document.getElementById("confirmBackdrop");
    const closeConfirmBtn = document.getElementById("closeConfirmBtn");
    const confirmYesBtn   = document.getElementById("confirmYesBtn");
    const confirmNoBtn    = document.getElementById("confirmNoBtn");

    const restBadge = document.getElementById("rest");
    const netStatus = document.getElementById("netStatus");
    const enableSoundBtn = document.getElementById("enableSoundBtn");
    const toggleAlertsBtn = document.getElementById("toggleAlertsBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const goStaffBtn = document.getElementById("goStaffBtn");

    restBadge.textContent = `Restaurant #${auth.restaurantId}`;

    goStaffBtn.addEventListener("click", ()=> location.href="screen6.html");

    // ===== State =====
    let orderSince = null;
    const ordersMap = new Map();
    const seenOrderIds = new Set();
    let firstOrdersLoad = true;

    let sortMode = "TIME"; // TIME | TABLE
    let openOrderId = null;
    let pendingDoneOrderId = null;

    let alertsEnabled = true;
    let audioCtx = null;
    let audioUnlocked = false;

    let pollingOrders = false;

    function showToast(msg){
      toastEl.textContent = msg;
      toastEl.style.display = "block";
      clearTimeout(toastEl._t);
      toastEl._t = setTimeout(()=>toastEl.style.display="none", 1600);
    }

    function setEmpty(isEmpty, msg){
      emptyEl.style.display = isEmpty ? "block" : "none";
      if(isEmpty) emptyEl.textContent = msg || "لا يوجد بيانات";
    }

    function setNetStatus(type, text){
      netStatus.classList.remove("ok","err","info");
      if(type) netStatus.classList.add(type);
      netStatus.textContent = text;
    }

    function updateKitchenCount(){
      const count = Array.from(ordersMap.values()).filter(o => o.status === "SENT_TO_KITCHEN").length;
      kitchenCount.textContent = `طلبات قيد التحضير: ${count}`;
    }

    // ===== Actions =====
    toggleAlertsBtn.addEventListener("click", ()=>{
      alertsEnabled = !alertsEnabled;
      toggleAlertsBtn.setAttribute("aria-pressed", alertsEnabled ? "true" : "false");
      toggleAlertsBtn.textContent = alertsEnabled ? "🔔 تنبيهات: تشغيل" : "🔕 تنبيهات: إيقاف";
    });

    logoutBtn.addEventListener("click", ()=>{
      localStorage.removeItem(AUTH_KEY);
      location.href="screen5.html";
    });

    async function unlockAudio(){
      try{
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        await audioCtx.resume();
        audioUnlocked = true;
        showToast("✅ تم تفعيل صوت الإشعارات");
      }catch(e){
        console.error(e);
        showToast("⚠️ المتصفح منع الصوت. جرّب مرة ثانية");
      }
    }
    enableSoundBtn.addEventListener("click", unlockAudio);

    function playRingtone(){
      if(!alertsEnabled || !audioUnlocked) return;

      const ctx = audioCtx;
      const now = ctx.currentTime;

      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.35, now + 0.02);
      gain.connect(ctx.destination);

      const osc = ctx.createOscillator();
      osc.type = "sine";

      const pattern = [
        {f: 880,  d: 0.18},
        {f: 988,  d: 0.18},
        {f: 1046, d: 0.18},
        {f: 988,  d: 0.18},
        {f: 880,  d: 0.22},
        {f: 0,    d: 0.22},
      ];

      let t = now;
      for(let r=0; r<2; r++){
        for(const p of pattern){
          if(p.f === 0){
            gain.gain.setValueAtTime(0.0001, t);
            t += p.d;
            continue;
          }
          osc.frequency.setValueAtTime(p.f, t);
          gain.gain.setValueAtTime(0.30, t);
          t += p.d;
        }
      }

      osc.connect(gain);
      osc.start(now);
      osc.stop(t + 0.02);
    }

    function playAlert(){
      if(navigator.vibrate) navigator.vibrate([200,100,200]);
      playRingtone();
    }

    // ===== Helpers =====
    function formatTime(iso){
      try{
        const d = new Date(iso);
        return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      }catch{return "—";}
    }

    function minutesSince(iso){
      const ms = Date.now() - new Date(iso).getTime();
      return Math.max(0, Math.floor(ms / 60000));
    }

    function isoMax(a,b){
      if(!a) return b;
      if(!b) return a;
      return (new Date(a).getTime() >= new Date(b).getTime()) ? a : b;
    }

    function escapeHtml(str){
      return String(str ?? "").replace(/[&<>"']/g, m => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
      }[m]));
    }

    // ===== Sort chips =====
    chipSortTime.addEventListener("click", ()=>{
      sortMode = "TIME";
      chipSortTime.classList.add("active");
      chipSortTable.classList.remove("active");
      renderOrders();
    });

    chipSortTable.addEventListener("click", ()=>{
      sortMode = "TABLE";
      chipSortTable.classList.add("active");
      chipSortTime.classList.remove("active");
      renderOrders();
    });

    // ===== Render Orders =====
    function getRenderedOrders(){
      let list = Array.from(ordersMap.values()).filter(o => o.status === "SENT_TO_KITCHEN");

      if(sortMode === "TABLE"){
        list.sort((a,b)=>{
          const ta = Number(a.tableNumber || 0);
          const tb = Number(b.tableNumber || 0);
          if(ta !== tb) return ta - tb;
          return new Date(b.createdAt) - new Date(a.createdAt);
        });
      } else {
        list.sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));
      }
      return list;
    }

    function renderOrders(){
      ordersEl.innerHTML = "";

      const list = getRenderedOrders();
      updateKitchenCount();

      if(list.length === 0){
        setEmpty(true, "لا توجد طلبات قيد التحضير الآن ✅");
        return;
      } else setEmpty(false);

      const frag = document.createDocumentFragment();

      list.forEach(o=>{
        const mins = minutesSince(o.createdAt);
        const late = mins >= 10; // ✅ في المطبخ غالباً نعتبر 10 دقائق تأخير

        const el = document.createElement("div");
        el.className = "card";
        el.innerHTML = `
          <div class="cardTop">
            <div class="tablePill">🪑 <b>طاولة ${o.tableNumber}</b></div>
            <div class="timePill ${late ? "late" : ""}">
              ${late ? "⏳ متأخر" : "🕒"} ${formatTime(o.createdAt)} • ${mins} د
            </div>
          </div>

          <div class="cardBottom">
            <span class="status">قيد التحضير</span>
            <span class="total">الإجمالي: ${Number(o.totalAmount ?? 0).toFixed(2)}</span>

            <div class="actions">
              <button class="btn" type="button" data-details="${o.orderId}">تفاصيل</button>
              <button class="btn danger big" type="button" data-done="${o.orderId}">تم الإنجاز ✅</button>
            </div>
          </div>
        `;
        frag.appendChild(el);
      });

      ordersEl.appendChild(frag);
    }

    // ===== Poll Orders =====
    async function pollOrders(){
      if(pollingOrders) return;
      pollingOrders = true;

      try{
        const url = new URL(`${API}/orders/sent-to-kitchen`);
        url.searchParams.set("page","0");
        url.searchParams.set("size","50");
        if(orderSince) url.searchParams.set("since", orderSince);

        const res = await fetch(url.toString(),{
          headers:{ "Authorization": `Bearer ${auth.token}`, "Accept":"application/json" }
        });

        if(res.status === 401){
          localStorage.removeItem(AUTH_KEY);
          showToast("انتهت الجلسة");
          setTimeout(()=>location.href="screen5.html", 400);
          return;
        }
        if(!res.ok){
          setNetStatus("err","API Error");
          return;
        }

        setNetStatus("ok","Online");

        const data = await res.json();
        const content = data.content || [];
        let maxCreated = orderSince;

        if(content.length){
          let newCount = 0;

          content.forEach(o=>{
            maxCreated = isoMax(maxCreated, o.createdAt);
            ordersMap.set(o.orderId, o);

            if(!seenOrderIds.has(o.orderId)){
              seenOrderIds.add(o.orderId);
              newCount++;
            }
          });

          orderSince = maxCreated;

          if(!firstOrdersLoad && newCount > 0) playAlert();
          firstOrdersLoad = false;

          renderOrders();
        } else {
          firstOrdersLoad = false;
          renderOrders();
        }
      }catch(e){
        console.error("pollOrders", e);
        setNetStatus("err","Offline?");
      }finally{
        pollingOrders = false;
      }
    }

    // ===== Done (with confirmation) =====
    function openConfirm(orderId){
      pendingDoneOrderId = orderId;
      confirmBackdrop.style.display = "block";
      confirmBackdrop.setAttribute("aria-hidden","false");
      confirmYesBtn.focus();
    }

    function closeConfirm(){
      confirmBackdrop.style.display = "none";
      confirmBackdrop.setAttribute("aria-hidden","true");
      pendingDoneOrderId = null;
    }

    closeConfirmBtn.addEventListener("click", closeConfirm);
    confirmNoBtn.addEventListener("click", closeConfirm);
    confirmBackdrop.addEventListener("click", (e)=>{ if(e.target === confirmBackdrop) closeConfirm(); });

    async function markDone(orderId){
      const res = await fetch(`${API}/orders/${orderId}${DONE_ENDPOINT_SUFFIX}`,{
        method:"PATCH",
        headers:{ "Authorization": `Bearer ${auth.token}`, "Accept":"application/json" }
      });
      if(!res.ok) throw new Error("done failed");

      // ✅ remove from kitchen screen immediately
      ordersMap.delete(orderId);
      seenOrderIds.delete(orderId);
      updateKitchenCount();

      if(openOrderId === orderId){
        closeModal();
      }
    }

    confirmYesBtn.addEventListener("click", async ()=>{
      if(!pendingDoneOrderId) return;

      confirmYesBtn.disabled = true;
      const old = confirmYesBtn.textContent;
      confirmYesBtn.textContent = "جارٍ التأكيد...";

      try{
        const oid = pendingDoneOrderId;
        await markDone(oid);
        closeConfirm();
        showToast("✅ تم تسجيل الطلب كمُنتهٍ");
        renderOrders();
      }catch(e){
        console.error(e);
        showToast("فشل تسجيل الطلب كمُنتهٍ (تحقق من endpoint)");
      }finally{
        confirmYesBtn.disabled = false;
        confirmYesBtn.textContent = old;
      }
    });

    // ===== Modal: تفاصيل الطلب =====
    function openModal(){
      modalBackdrop.style.display = "block";
      modalBackdrop.setAttribute("aria-hidden","false");
      closeModalBtn.focus();
    }
    function closeModal(){
      modalBackdrop.style.display = "none";
      modalBackdrop.setAttribute("aria-hidden","true");
      openOrderId = null;
    }

    closeModalBtn.addEventListener("click", closeModal);
    modalBackdrop.addEventListener("click", (e)=>{ if(e.target === modalBackdrop) closeModal(); });

    document.addEventListener("keydown", (e)=>{
      if(e.key === "Escape"){
        if(confirmBackdrop.style.display==="block") closeConfirm();
        else if(modalBackdrop.style.display==="block") closeModal();
      }
    });

    async function loadOrderDetails(orderId){
      modalBody.innerHTML = `<div class="line"><span>تحميل التفاصيل</span><b><span class="spin"></span></b></div>`;
      modalDoneBtn.style.display = "none";

      try{
        const res = await fetch(`${API}/orders/${orderId}`,{
          headers:{ "Authorization": `Bearer ${auth.token}`, "Accept":"application/json" }
        });

        if(!res.ok){
          modalBody.innerHTML = `<div class="line"><span>خطأ</span><b>تعذر تحميل التفاصيل</b></div>`;
          return;
        }

        const d = await res.json();

        modalTitle.textContent = `تفاصيل الطلب #${d.orderId} • طاولة ${d.tableNumber}`;

        const total = Number(d.totalAmount ?? 0).toFixed(2);
        const note = (d.note || "").trim();

        modalBody.innerHTMLstrыMy = `
          <div class="line"><span>الحالة</span><b>${escapeHtml(d.status || "—")}</b></div>
          <div class="line"><span>الوقت</span><b>${escapeHtml(formatTime(d.createdAt))}</b></div>
          <div class="line"><span>الإجمالي</span><b>${total}</b></div>
          ${note ? `<div class="line"><span>ملاحظة</span><b>${escapeHtml(note)}</b></div>` : ``}
          <div class="items" id="itemsBox"></div>
        `;

        // Fix: assign correctly
        modalBody.innerHTML = `
          <div class="line"><span>الحالة</span><b>${escapeHtml(d.status || "—")}</b></div>
          <div class="line"><span>الوقت</span><b>${escapeHtml(formatTime(d.createdAt))}</b></div>
          <div class="line"><span>الإجمالي</span><b>${total}</b></div>
          ${note ? `<div class="line"><span>ملاحظة</span><b>${escapeHtml(note)}</b></div>` : ``}
          <div class="items" id="itemsBox"></div>
        `;

        const itemsBox = document.getElementById("itemsBox");
        const items = d.items || [];

        items.forEach(it=>{
          const el = document.createElement("div");
          el.className = "item";
          el.innerHTML = `
            <div>
              <div class="name">${escapeHtml(it.itemName)} × ${Number(it.quantity || 0)}</div>
              ${it.note ? `<div class="sub">📝 ${escapeHtml(it.note)}</div>` : `<div class="sub">—</div>`}
            </div>
            <div style="text-align:left">
              <div style="font-weight:1000">${Number(it.totalPrice ?? 0).toFixed(2)}</div>
              <div class="sub">سعر: ${Number(it.unitPrice ?? 0).toFixed(2)}</div>
            </div>
          `;
          itemsBox.appendChild(el);
        });

        if(d.status === "SENT_TO_KITCHEN"){
          modalDoneBtn.style.display = "inline-flex";
        } else {
          modalDoneBtn.style.display = "none";
        }

      }catch(e){
        console.error(e);
        modalBody.innerHTML = `<div class="line"><span>خطأ</span><b>تعذر الاتصال بالخادم</b></div>`;
      }
    }

    modalRefreshBtn.addEventListener("click", ()=>{ if(openOrderId) loadOrderDetails(openOrderId); });
    modalDoneBtn.addEventListener("click", ()=>{ if(openOrderId) openConfirm(openOrderId); });

    // ===== Global click actions =====
    document.addEventListener("click", (e)=>{
      const doneBtn = e.target.closest("[data-done]");
      if(doneBtn){
        const orderId = Number(doneBtn.dataset.done);
        openConfirm(orderId);
        return;
      }

      const detailsBtn = e.target.closest("[data-details]");
      if(detailsBtn){
        const orderId = Number(detailsBtn.dataset.details);
        openOrderId = orderId;
        openModal();
        loadOrderDetails(orderId);
        return;
      }
    });

    // ===== Timers =====
    setInterval(pollOrders, ORDERS_POLL_MS);

    // Initial load
    setNetStatus("info","Connecting…");
    pollOrders();
    renderOrders();
</script>

</body>
