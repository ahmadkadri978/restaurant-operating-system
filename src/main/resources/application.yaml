app:
  jwt:
    secret: ${APP_JWT_SECRET}
    issuer: restaurant-qr
    expiration-minutes: 21600
  upload:
    dir: ${APP_UPLOAD_DIR:../frontend-repo/uploads}
    max-file-size: 5MB
    allowed-extensions: jpg,jpeg,png,gif,webp

spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 50MB

logging:
  level:
    org.flywaydb: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never



