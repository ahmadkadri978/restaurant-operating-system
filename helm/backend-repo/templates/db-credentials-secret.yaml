{{- /*
  db-credentials-secret.yaml

  The db-sealed-secret.yaml (committed by CI) is reconciled by the SealedSecret
  controller into a real k8s Secret BEFORE Helm/FluxCD runs the HelmRelease.
  So lookup will always find the Secret on a running cluster.

  If the Secret is somehow absent (e.g. fresh cluster, controller not ready yet)
  the template intentionally renders empty passwords so MySQL rejects the
  connection loudly, rather than silently using a wrong/default password.
*/ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-db-credentials" .Release.Name) -}}
{{- $rootPw := "" -}}
{{- $userPw := "" -}}
{{- if $existing -}}
  {{- $rootPw = index $existing.data "MYSQL_ROOT_PASSWORD" | b64dec -}}
  {{- $userPw  = index $existing.data "MYSQL_PASSWORD" | b64dec -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db-credentials
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: {{ $rootPw | quote }}
  MYSQL_DATABASE: "restaurantdb"
  MYSQL_USER: "backenduser"
  MYSQL_PASSWORD: {{ $userPw | quote }}
  DB_URL: {{ printf "jdbc:mysql://%s-mysql:3306/restaurantdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC" .Release.Name | quote }}
  DB_USERNAME: "backenduser"
