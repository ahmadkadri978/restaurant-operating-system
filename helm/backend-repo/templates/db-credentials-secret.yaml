{{- /*
  db-credentials-secret.yaml
  Holds ONLY the static, non-secret fields that MySQL and the app need
  (database name, username, JDBC URL).
  MYSQL_ROOT_PASSWORD and MYSQL_PASSWORD are NOT set here — they live
  exclusively in the SealedSecret (db-sealed-secret.yaml), which is sealed
  with MASTER_CRT in the bootstrap workflow and decrypted by the controller
  that holds SEALED_SECRET_KEY.
  The sealedsecrets.bitnami.com/managed annotation tells the SealedSecret
  controller to MERGE the decrypted password keys INTO this Secret object,
  so the final in-cluster Secret has all keys that MySQL and the app expect.
  Why no lookup / no empty passwords:
    - The old lookup pattern wrote "" as the password on a fresh cluster
      (nothing to look up yet), causing MySQL to reject the empty password
      and the app pod to CrashLoop.
    - With this approach the Secret starts with only static keys. MySQL
      will NOT start until the SealedSecret controller patches in the real
      password — this is correct: Kubernetes will just retry the pod.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db-credentials
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
    sealedsecrets.bitnami.com/managed: "true"
type: Opaque
stringData:
  MYSQL_DATABASE: "restaurantdb"
  MYSQL_USER: "backenduser"
  DB_URL: {{ printf "jdbc:mysql://%s-mysql:3306/restaurantdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC" .Release.Name | quote }}
  DB_USERNAME: "backenduser"