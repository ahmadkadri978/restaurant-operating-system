{{- /*
  db-credentials-secret.yaml

  Helm creates this secret initially with empty passwords.
  The sealedsecrets.bitnami.com/managed annotation allows the SealedSecret
  controller to update this secret with real passwords after decryption.
*/ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-db-credentials" .Release.Name) -}}
{{- $rootPw := "" -}}
{{- $userPw := "" -}}
{{- if $existing -}}
  {{- $rootPw = index $existing.data "MYSQL_ROOT_PASSWORD" | b64dec -}}
  {{- $userPw  = index $existing.data "MYSQL_PASSWORD" | b64dec -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db-credentials
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
    sealedsecrets.bitnami.com/managed: "true"
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: {{ $rootPw | quote }}
  MYSQL_DATABASE: "restaurantdb"
  MYSQL_USER: "backenduser"
  MYSQL_PASSWORD: {{ $userPw | quote }}
  DB_URL: {{ printf "jdbc:mysql://%s-mysql:3306/restaurantdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC" .Release.Name | quote }}
  DB_USERNAME: "backenduser"
